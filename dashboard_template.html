<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: fixed filter bar on top, horizontal tabs, card grid content. Colours: blue = CT, orange = T. */
:root{
  color-scheme: light;
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f4f6f8; --line:#dde1e7;
  --ink:#121820; --ink-2:#4b5563; --ink-3:#7a8493;
  --accent:#2a78d6; --ct:#2a78d6; --t:#eb6834;
  --good:#128a4f; --bad:#d8383a; --warn:#b97a00;
  --font-d:'Rajdhani','Arial Narrow',sans-serif; --font-b:'IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0e1217; --surface:#161c24; --surface-2:#1c242e; --line:#28313d;
    --ink:#e8ecf1; --ink-2:#aab3bf; --ink-3:#7c8795;
    --accent:#3987e5; --ct:#3987e5; --t:#e0652f;
    --good:#2bb673; --bad:#ee5a5a; --warn:#e0a526;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e1217; --surface:#161c24; --surface-2:#1c242e; --line:#28313d;
  --ink:#e8ecf1; --ink-2:#aab3bf; --ink-3:#7c8795;
  --accent:#3987e5; --ct:#3987e5; --t:#e0652f;
  --good:#2bb673; --bad:#ee5a5a; --warn:#e0a526;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--font-d);margin:0;font-weight:600;letter-spacing:.02em;text-wrap:balance}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 48px}
header.top .wrap{padding-bottom:0}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0}
.top-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:26px;text-transform:uppercase}
.brand span{color:var(--ink-3);font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters label{display:flex;gap:6px;align-items:center;color:var(--ink-3);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px}
nav.tabs button{border:0;background:transparent;padding:8px 14px;cursor:pointer;color:var(--ink-2);border-bottom:3px solid transparent;font-family:var(--font-d);font-size:17px;font-weight:600;letter-spacing:.03em;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-top:18px;display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h2{font-size:20px;margin-bottom:2px}
.card .sub{color:var(--ink-3);font-size:12.5px;margin-bottom:10px}
.kpi .lab{color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em}
.kpi .val{font-family:var(--font-d);font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .ref{font-size:12px;color:var(--ink-3)}
.up{color:var(--good)} .down{color:var(--bad)} .mid{color:var(--warn)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink-3);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:var(--surface)}
th.sortable{cursor:pointer} th.sortable:hover{color:var(--ink)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
tr.me td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.scroll{overflow-x:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.pill.W{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.pill.L{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.pill.D{background:var(--surface-2);color:var(--ink-2)}
.side{display:inline-block;width:22px;text-align:center;border-radius:4px;font-size:11px;font-weight:700;color:#fff}
.side.CT{background:var(--ct)} .side.T{background:var(--t)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hrow{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;margin:6px 0}
.hrow .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0;font-size:12.5px;color:var(--ink-2)}
.legend label{display:flex;align-items:center;gap:5px;cursor:pointer}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.maprow{display:grid;grid-template-columns:minmax(300px,640px) 1fr;gap:14px;align-items:start}
@media (max-width:900px){.maprow{grid-template-columns:1fr}}
svg.radar{width:100%;height:auto;display:block;border-radius:8px;background:#000;max-height:80vh}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;max-width:280px;display:none;line-height:1.35}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink-2);font-size:13px}
.ins{display:grid;grid-template-columns:6px 1fr;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ins .stripe{border-radius:3px}
.ins.alta .stripe{background:var(--bad)} .ins.media .stripe{background:var(--warn)} .ins.ok .stripe{background:var(--good)} .ins.info .stripe{background:var(--accent)}
.ins h3{font-size:18px}
.ins p{margin:3px 0;color:var(--ink-2)}
.ins .ev{color:var(--ink-3);font-size:12.5px}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.timeline td{font-size:13px}
.ev-list{margin:4px 0 4px 26px;padding:0;list-style:none;font-size:12.5px;color:var(--ink-2)}
.back{margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;cursor:pointer;color:var(--ink-2)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{padding:40px 16px;text-align:center;color:var(--ink-3)}
code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface-2);border-radius:6px}
pre{padding:10px 12px;overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .25s}}

.zwrap{position:relative}
.zctl{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:2}
.zctl button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:rgba(16,22,29,.88);color:#e6edf5;cursor:pointer;font-size:16px;line-height:1;padding:0}
.zctl button:hover{background:rgba(40,52,66,.95)}
.zhint{position:absolute;left:8px;bottom:8px;font-size:11px;color:#cfd8e3;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:5px;pointer-events:none}
svg.radar{cursor:grab;touch-action:pan-y;user-select:none}
svg.radar.grab{cursor:grabbing}
.ws{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.ws h4{margin:0 0 2px;font-size:15px}.ws p{margin:3px 0;font-size:14px}
.ws a,.srcs a{color:#7db8ff}
.srcs{font-size:12px;color:var(--muted,#9fb0c3);margin-top:6px}
.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}@media(max-width:700px){.frames{grid-template-columns:repeat(2,1fr)}}
.dcard{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:20px;align-items:start}
@media(max-width:820px){.dcard{grid-template-columns:1fr}}
.dcard .iss{border-left:3px solid var(--bad,#ff5c5c);padding:2px 0 2px 12px;margin:10px 0}
.dcard .iss.mid{border-color:#e8c53a}.dcard .iss.ok{border-color:#2bd47d}
.dcard .iss h4{margin:0 0 2px;font-size:15px}.dcard .iss p{margin:2px 0;font-size:14px}
.dcard .iss .fix{color:var(--muted,#9fb0c3)}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;margin-top:6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;margin:8px 0 2px}
.bars .col{flex:1;display:flex;align-items:flex-end;gap:2px;height:100%}
.bars .b{flex:1;border-radius:3px 3px 0 0;min-height:2px}
.barlab{display:flex;gap:6px;font-size:11px;color:var(--muted,#9fb0c3)}.barlab span{flex:1;text-align:center}
</style>
<style>
/* E-learning, in-app image viewer and match-analysis styles */
.lrn-btn{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.lrn-maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.lrn-map{display:flex;flex-direction:column;gap:4px;text-align:left;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer;color:var(--ink);font:inherit}
.lrn-map:hover{border-color:var(--accent)}
.lrn-map svg{width:100%;aspect-ratio:1/1;border-radius:6px;background:var(--surface)}
.lrn-map .n{font-weight:700;font-size:15px}.lrn-map .t{color:var(--ink-3);font-size:12px}
.lrn-top{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:14px;margin-top:10px;align-items:start}
.lrn-radar{width:100%;aspect-ratio:1/1;border-radius:8px;background:var(--surface-2)}
@media(max-width:640px){.lrn-top{grid-template-columns:1fr}}
.lrn-list{margin:4px 0 10px 18px;display:grid;gap:6px;font-size:14px;line-height:1.45}
.lrn-mods{display:grid;gap:6px;margin-top:8px}
.lrn-mod{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface-2)}
.lrn-mod summary{cursor:pointer;font-weight:600}
.card h3{font-size:14px;margin:12px 0 2px;color:var(--ink-2)}
.kpis{display:flex;flex-wrap:wrap;gap:16px}.kpis div{display:flex;flex-direction:column}.kpis b{font-size:20px}.kpis span{color:var(--ink-3);font-size:12px}
.lrn-shots{display:grid;gap:14px;margin-top:8px}
.lrn-shot h4{font-size:14px;margin:0 0 2px}.lrn-what{font-size:13px;color:var(--ink-2);margin-bottom:6px}.lrn-what span{color:var(--ink-3)}
.lrn-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.lrn-imgs img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);display:block}
.lrn-broken{font-size:12px;color:var(--ink-3)}
#lb{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center}
.lb-bg{position:absolute;inset:0;background:rgba(0,0,0,.82)}
.lb-fig{position:relative;margin:0;max-width:94vw;max-height:92vh;display:flex;flex-direction:column;align-items:center;gap:6px}
.lb-fig img{max-width:94vw;max-height:84vh;border-radius:8px;display:block;background:#222}
.lb-fig figcaption,.lb-fig .lrn-broken{color:#eee;font-size:13px}
.lb-x{position:absolute;top:14px;right:18px;z-index:2;font-size:22px;line-height:1;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.lb-n{position:absolute;top:50%;transform:translateY(-50%);z-index:2;font-size:34px;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 16px;cursor:pointer}
.lb-prev{left:14px}.lb-next{right:14px}
.lrn-cmap{cursor:zoom-in;max-width:680px;margin:6px auto 0}.lrn-cmap-svg{width:100%;height:auto;display:block;border-radius:8px;background:#111}
.lb-map{width:min(94vw,92vh);height:min(94vw,92vh)}.lb-map svg{width:100%;height:100%;display:block;border-radius:8px;background:#111}

.an h3{margin:16px 0 6px}.an-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:6px 0}.an-kpis div{background:var(--surface-2);border-radius:8px;padding:8px 10px}.an-kpis b{display:block;font-size:20px}.an-kpis span{font-size:12px;color:var(--muted)}
.an-tbl{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}.an-tbl th,.an-tbl td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--border,#3333)}.an-tbl .num{text-align:right;white-space:nowrap}
.an-bar{display:inline-block;width:90px;height:8px;background:var(--surface-2);border-radius:4px;vertical-align:middle;overflow:hidden}.an-bar i{display:block;height:100%;background:var(--accent,#3b82f6);border-radius:4px}
.an-land,.an-note{font-size:13px;color:var(--muted);margin:6px 0}.an-lu{display:flex;flex-wrap:wrap;gap:6px}.an-lu-i{font-size:12px;padding:3px 8px;border-radius:12px;background:var(--surface-2)}.an-lu-i.usata{background:#16a34a33}.an-lu-i.vicina{background:#ca8a0433}
.lrn-warn{background:var(--surface-2);border-left:3px solid var(--warn,#c8841a);padding:8px 10px;border-radius:6px;font-size:13px}
.lrn-vids{display:grid;gap:12px;margin-top:8px}
.lrn-vid{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:start}
.lrn-thumb img{width:200px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);display:block}
.lrn-vbody h4{font-size:14px;margin:0 0 2px}.lrn-vmeta{font-size:12px;color:var(--ink-3);margin-bottom:6px}
.lrn-marks{display:flex;flex-wrap:wrap;gap:6px}
.lrn-marks a{font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--ink-1);text-decoration:none;background:var(--surface-2)}
.lrn-marks a span{color:var(--ink-3);margin-left:4px;font-variant-numeric:tabular-nums}
.lrn-marks a:hover{border-color:var(--accent,#4a7)}
.lrn-offs{display:grid;gap:12px;margin-top:8px}
.lrn-off{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:start}
.lrn-thr{cursor:zoom-in}.lrn-thr-svg{width:200px;height:200px;display:block;border-radius:8px;border:1px solid var(--line);background:#111}
@media(max-width:620px){.lrn-off{grid-template-columns:1fr}.lrn-thr-svg{width:100%;height:auto}}
.lrn-off h4{font-size:14px;margin:0 0 2px}
.lrn-cmd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lrn-cmd code{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;word-break:break-all}
.lrn-how{margin:6px 0 0 18px;font-size:13px}.lrn-how code{background:var(--surface-2);padding:1px 5px;border-radius:4px}
@media(max-width:620px){.lrn-vid{grid-template-columns:1fr}.lrn-thumb img{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="top-row">
    <div class="brand"><h1>CS Coach</h1><span id="who"></span></div>
    <div class="filters" id="filters"></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</div></header>
<div class="wrap"><main id="main"></main></div>
<div id="tip"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>

<script>
/* Placeholders replaced by tools/build_dashboard.py / cs_coach.py:
   DATA   -> the match archive (cs_data.json) embedded by cs_coach.write_html()
   MAPS   -> radar calibration per map (src/data/maps.json)
   RADARS -> radar images as data URIs (src/assets/radar) */

  for(const m of ms){
    if(m.result==='W') A.mw++;
    const rows = m.rounds.filter(r => sideOk(side, r));
    for(const r of rows){
      A.R++; A.rw += r.won?1:0; A.k += r.k; A.d += r.d; A.a += r.a; A.dmg += r.dmg;
      A.surv += r.survived?1:0;
      if(r.k>0 || r.a>0 || r.survived || r.traded) A.kast++;
      if(r.d>0 && r.traded) A.trD++;
      A.mk[Math.min(r.k,5)]++;
      if(r.survived && r.k===0 && r.dmg<25 && !r.won) A.pas++;
    }
    for(const e of m.me.kills) if(sideOk(side,e)){ if(e.hs) A.hs++; if(e.open) A.ok++; }
    for(const e of m.me.deaths) if(sideOk(side,e)){ if(e.open) A.od++; }
    const p = me(m);
    A.tk += side==='all' ? p.trade_kills : p.side[side].trade_kills;
    const rs = new Map(m.rounds.map(r => [r.r, r.side]));
    for(const c of m.me.clutches){ if(side==='all' || rs.get(c.r)===side){ A.clA++; if(c.won) A.clW++; } }
  }
  const R = Math.max(1, A.R);
  A.kd = A.k / Math.max(1, A.d);
  A.adr = A.dmg / R;
  A.kastP = A.kast / R;
  A.hsP = A.k ? A.hs / A.k : NaN;
  A.okP = (A.ok + A.od) ? A.ok / (A.ok + A.od) : NaN;
  A.rwP = A.rw / R;
  A.survP = A.surv / R;
  A.trP = A.d ? A.trD / A.d : NaN;
  const kr = (A.k/R)/0.679, sr = ((R-A.d)/R)/0.317;
  const rmk = (A.mk[1] + 4*A.mk[2] + 9*A.mk[3] + 16*A.mk[4] + 25*A.mk[5]) / R / 1.277;
  A.rating = A.R ? (kr + 0.7*sr + rmk)/2.7 : NaN;
  return A;
}
function utilAgg(ms, side='all'){
  const U = {smoke:0, flash:0, he:0, molotov:0, ef:0, eft:0, tf:0, tft:0, fa:0, heD:0, moD:0, tDmg:0, R:0, thrown:{smoke:0,flash:0,he:0,molotov:0}};
  for(const m of ms){
    const p = me(m);
    U.R += m.rounds.filter(r => sideOk(side, r)).length;
    for(const u of m.me.util) if(sideOk(side,u)) U.thrown[u.kind]++;
    U.ef += p.enemies_flashed; U.eft += p.enemy_flash_time; U.tf += p.team_flashed; U.tft += p.team_flash_time;
    U.fa += p.flash_assists; U.heD += p.dmg_he; U.moD += p.dmg_molotov; U.tDmg += p.team_damage;
    U.flashAll = (U.flashAll||0) + p.thrown_flash;
  }
  return U;
}
function econ(ms, side='all'){
  const T = {Pistol:[], Eco:[], Force:[], Full:[]};
  for(const m of ms) for(const r of m.rounds){
    if(!sideOk(side,r)) continue;
    const t = (r.r===1 || r.r===13) ? 'Pistol' : r.equip<1500 ? 'Eco' : r.equip<4000 ? 'Force' : 'Full';
    T[t].push(r);
  }
  return T;
}
</script>
<script>
/* Indicative reference values used to colour stats (rough public benchmarks, not official data) */
const REF = {rating:1.0, kd:1.0, adr:75, kastP:.70, hsP:.45, okP:.50, trP:.25, rwP:.50};
function cmpClass(v, ref, inv=false){
  if(!isFinite(v)) return '';
  const r = v/ref; const good = inv ? r<=0.92 : r>=1.08; const bad = inv ? r>=1.08 : r<=0.92;
  return good ? 'up' : bad ? 'down' : 'mid';
}

<script>
/* Maps / radar: world -> radar coordinates, heatmaps, map cards */
function ptFn(map, extra){
  const c = MAPS[map];
  if(c) return (x,y) => [ (x - c.pos_x)/c.scale/1024*1000, (c.pos_y - y)/c.scale/1024*1000 ];
  // fallback: normalise on the available points
  const xs = extra.map(p=>p[0]), ys = extra.map(p=>p[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const s = Math.max(x1-x0, y1-y0, 1) * 1.1;
  return (x,y) => [ 50 + (x-x0)/s*900, 950 - (y-y0)/s*900 ];
}
function radarSVG(map, shapes, opts={}){
  const img = RADARS[map] ? `<image href="${RADARS[map]}" x="0" y="0" width="1000" height="1000" opacity=".95"/>` :
    `<rect width="1000" height="1000" fill="#10161d"/><text x="500" y="40" fill="#7c8795" text-anchor="middle" font-size="22">Radar non disponibile per ${esc(map)}</text>`;
  return `<svg class="radar" viewBox="${opts.vb||'0 0 1000 1000'}" role="img" aria-label="Mappa ${esc(mapName(map))}">
    <defs><radialGradient id="hotk"><stop offset="0" stop-color="#2bd47d" stop-opacity=".55"/><stop offset="1" stop-color="#2bd47d" stop-opacity="0"/></radialGradient>
    <radialGradient id="hotd"><stop offset="0" stop-color="#ff4b4b" stop-opacity=".6"/><stop offset="1" stop-color="#ff4b4b" stop-opacity="0"/></radialGradient></defs>
    ${img}${shapes.join('')}</svg>`;
}
const tipAttr = t => `data-tip="${esc(t)}"`;
function killTip(e, label){
  return `R${e.r} · ${e.t}s · ${wname(e.w)}${e.hs?' · headshot':''}${e.wb?' · wallbang':''}${e.sm?' · attraverso smoke':''}${e.blind?' · eri accecato':''} · ${f1(e.dist,0)} m · ${label}`;
}
function zoneCells(pts){
  const g = new Map();
  for(const p of pts){
    const cx = Math.max(0,Math.min(9,Math.floor(p.u/100))), cy = Math.max(0,Math.min(9,Math.floor(p.v/100)));
    const key = cx+','+cy; const c = g.get(key) || {cx,cy,k:0,d:0,names:{}}; if(p.type==='k') c.k++; else { c.d++; if(p.pl) c.names[p.pl] = (c.names[p.pl]||0)+1; } g.set(key,c);
  }
  return [...g.values()];
}
function mapScene(map, ms, side, L){
  const kills = [], deaths = [];
  for(const m of ms) for(const e of m.me.kills) if(sideOk(side,e)) kills.push(e);
  for(const m of ms) for(const e of m.me.deaths) if(sideOk(side,e) && !e.teamkill) deaths.push(e);
  const all = [...kills.map(e=>[e.ax,e.ay]), ...deaths.map(e=>[e.vx,e.vy])];
  const pt = ptFn(map, all.length?all:[[0,0],[1,1]]);
  const sh = [], pts = [];
  if(L.heat){
    for(const e of kills){ const [u,v]=pt(e.ax,e.ay); sh.push(`<circle cx="${u}" cy="${v}" r="55" fill="url(#hotk)"/>`); }
    for(const e of deaths){ const [u,v]=pt(e.vx,e.vy); sh.push(`<circle cx="${u}" cy="${v}" r="55" fill="url(#hotd)"/>`); }
  }
  for(const e of kills){
    const [u,v]=pt(e.ax,e.ay), [u2,v2]=pt(e.vx,e.vy); pts.push({u,v,type:'k'});
    if(L.kills) sh.push(`<line x1="${u}" y1="${v}" x2="${u2}" y2="${v2}" stroke="#2bd47d" stroke-opacity=".45" stroke-width="2"/>
      <circle cx="${u}" cy="${v}" r="7" fill="#2bd47d" stroke="#000" stroke-width="1.5" ${tipAttr(killTip(e,'uccisione di '+e.victim))}/>`);
  }
  for(const e of deaths){
    const [u,v]=pt(e.vx,e.vy), [u2,v2]=pt(e.ax,e.ay); pts.push({u,v,type:'d', pl: e.c && e.c.pl});
    if(L.deaths) sh.push(`<line x1="${u2}" y1="${v2}" x2="${u}" y2="${v}" stroke="#ff5c5c" stroke-opacity=".4" stroke-width="2" stroke-dasharray="6 4"/>
      <path d="M${u-7} ${v-7}L${u+7} ${v+7}M${u+7} ${v-7}L${u-7} ${v+7}" stroke="#ff5c5c" stroke-width="4" stroke-linecap="round" ${tipAttr(killTip(e,'ucciso da '+e.killer)+(e.traded?' · tradato':' · non tradato'))}/>`);
  }
  return {pt, sh, pts, kills, deaths};
}
function zoneList(pts, pt){
  const cells = zoneCells(pts).filter(c => c.k + c.d >= 2).sort((a,b) => (b.d - a.d) || (b.k - a.k)).slice(0,6);
  return cells;
}
</script>
<script>
/* Coach insights: rule-based strengths / weaknesses computed from the aggregates */
function insights(ms, side){
  const out = [];
  const A = agg(ms, side), U = utilAgg(ms, side);
  const add = (sev, title, ev, tip) => out.push({sev, title, ev, tip});
  if(A.R < 15) return [{sev:'info', title:'Servono più round', ev:`Con ${A.R} round i numeri sono troppo ballerini.`, tip:'Aggiungi altre demo.'}];
  if(A.ok + A.od >= 4){
    if(A.okP < .42) add('alta', 'Perdi troppi duelli d\'apertura', `Vinci ${A.ok} su ${A.ok+A.od} primi scontri (${pc(A.okP)}).`, 'Non fare il primo peek da solo: usa una flash o un compagno vicino, oppure cambia angolo dopo il primo contatto. In soloq, prendi info (suoni, utility) prima di dare il peek.');
    else if(A.okP > .55) add('ok', 'Buoni duelli d\'apertura', `Vinci ${A.ok} su ${A.ok+A.od} primi scontri (${pc(A.okP)}).`, 'Continua a prenderti il primo contatto quando hai supporto.');
  }
  if(A.d >= 8){
    if(A.trP < .22) add('alta', 'Muori spesso senza trade', `Solo ${pc(A.trP)} delle tue morti viene vendicata entro 5 secondi.`, 'Gioca più vicino a un compagno (ma non nello stesso spot) e non morire in posizioni isolate. In soloq comunica dove vai o segui chi fa il push.');
    else if(A.trP > .4) add('ok', 'Ottime trade sulle tue morti', `${pc(A.trP)} delle tue morti viene vendicata.`, 'Stai giocando vicino ai compagni.');
  }
  let early = 0, deathsN = 0;
  for(const m of ms) for(const e of m.me.deaths) if(sideOk(side,e) && !e.teamkill){ deathsN++; if(e.t < 20) early++; }
  if(deathsN >= 8 && early/deathsN > .4) add('media', 'Muori troppo presto nel round', `${pc(early/deathsN)} delle morti avviene nei primi 20 secondi.`, 'Rallenta l\'apertura: aspetta le smoke/flash della squadra prima di impegnare un duello, o usa più tempo per raccogliere info.');
  if(A.pas >= 3) add('media', 'Round passivi', `${A.pas} round in cui sei vivo a fine round con 0 kill e meno di 25 danni, e la squadra perde.`, 'Quando resti vivo a fine round sei stato troppo lontano dall\'azione: partecipa al fight o lancia utility per aiutare.');
  const fl = U.flashAll || 0;
  if(fl >= 6){
    const per = U.ef / fl;
    if(per < .6) add('media', 'Flash poco efficaci', `${U.ef} nemici accecati con ${fl} flash (${f1(per,2)} a flash).`, 'Impara 2-3 popflash per mappa e coordina il peek: la flash deve esplodere prima che esci.');
    if(U.tf >= 4) add('media', 'Accechi i compagni', `${U.tf} compagni accecati (${f1(U.tft,1)} secondi totali).`, 'Controlla la direzione di lancio e avvisa quando lanci.');
  }
  if(U.tDmg >= 40) add('media', 'Danni ai compagni', `${f1(U.tDmg,0)} danni inflitti ai compagni.`, 'Attenzione a HE/molotov vicino ai compagni e agli spray con i compagni in linea.');
  const perRound = (U.thrown.smoke + U.thrown.flash + U.thrown.he + U.thrown.molotov) / Math.max(1,U.R);
  if(perRound < .9) add('media', 'Poca utility per round', `${f1(perRound,2)} granate a round (riferimento: almeno ~1).`, 'Compra e usa le granate ogni round: una smoke o una flash in più cambia più round di un fucile migliore.');
  let shots=0,hits=0,hsHits=0;
  for(const m of ms) for(const w of m.me.weapons) if(['ak47','m4a1','galilar','famas','aug','sg556'].includes(w.w)){ shots+=w.shots; hits+=w.hits; hsHits+=w.hs_hits; }
  if(shots >= 150){
    const acc = hits/shots;
    if(acc < .15) add('media', 'Precisione bassa con i fucili', `${pc(acc)} dei colpi va a segno (${hits} su ${shots}).`, 'Spara a raffiche corte, fermati prima di sparare e non spruzzare a lunga distanza.');
    if(hits >= 25 && hsHits/hits < .22) add('media', 'Posizione del mirino troppo bassa', `Solo ${pc(hsHits/hits)} dei colpi a segno va alla testa.`, 'Tieni il mirino all\'altezza della testa mentre ti muovi e precontrolla gli angoli (crosshair placement).');
    else if(hits >= 25 && hsHits/hits > .38) add('ok', 'Buon controllo della testa', `${pc(hsHits/hits)} dei colpi a segno va alla testa.`, 'Tieni questo livello.');
  }
  if(A.clA >= 3 && A.clW === 0) add('media', 'Clutch tutti persi', `0 clutch vinti su ${A.clA}.`, 'Nei 1vX evita di cercare subito il fight: usa il tempo, fai rumore in un posto e attacca da un altro angolo.');
  const ct = agg(ms,'CT'), tt = agg(ms,'T');
  if(side==='all' && ct.R >= 20 && tt.R >= 20 && Math.abs(ct.kd - tt.kd) > .35)
    add('info', ct.kd > tt.kd ? 'Più forte in difesa (CT)' : 'Più forte in attacco (T)', `K/D ${f1(ct.kd,2)} in CT contro ${f1(tt.kd,2)} in T.`, `Dedica più pratica al lato ${ct.kd > tt.kd ? 'T' : 'CT'}.`);
  // recurring death zones
  const byMap = {};
  for(const m of ms) (byMap[m.map] = byMap[m.map] || []).push(m);
  for(const [map, mm] of Object.entries(byMap)){
    const sc = mapScene(map, mm, side, {kills:false,deaths:false,heat:false});
    const cells = zoneCells(sc.pts).filter(c => c.d >= 3 && c.d > c.k * 1.5);
    for(const c of cells.slice(0,2))
      add('media', `Zona pericolosa su ${mapName(map)}`, `${c.d} morti e ${c.k} kill nella stessa area (riquadro ${c.cx+1}-${c.cy+1} della mappa).`, 'Cambia posizione o tempi quando passi di qui: guarda la tab Mappe per capire da dove ti uccidono.');
  }
  if(A.adr >= REF.adr*1.08) add('ok', 'Danni a round sopra la media', `${f1(A.adr)} ADR (riferimento ${REF.adr}).`, 'Ottimo impatto: concentrati su sopravvivenza e trade per convertirlo in vittorie.');
  if(A.kastP < .6) add('alta', 'Poca costanza (KAST basso)', `Contribuisci o sopravvivi solo nel ${pc(A.kastP)} dei round (riferimento ${pc(REF.kastP)}).`, 'Punta a ottenere almeno un kill, un assist, la sopravvivenza o una trade in più round: gioca meno rischioso nei round già decisi.');
  const order = {alta:0, media:1, info:2, ok:3};
  return out.sort((a,b) => order[a.sev]-order[b.sev]);
}

<script>

const TABS = LITE ? [['panoramica','Panoramica']] : [['panoramica','Panoramica'],['partite','Partite'],['mappe','Mappe'],['utility','Utility e smoke'],['errori','Errori e fix'],['armi','Armi e mira'],['coach','Coach']];

    <label>Esito <span class="seg" id="fRes">${[['all','Tutti'],['W','Vinte'],['L','Perse']].map(([s,t])=>`<button data-v="${s}" aria-pressed="${state.fRes===s}">${t}</button>`).join('')}</span></label>

function kpi(lab, val, ref, cls=''){
  return `<div class="card kpi"><div class="lab">${lab}</div><div class="val ${cls}">${val}</div><div class="ref">${ref||'&nbsp;'}</div></div>`;
}

function trendSVG(ms, side, key){
  const defs = {rating:['Rating',a=>a.rating,2], adr:['ADR',a=>a.adr,1], kd:['K/D',a=>a.kd,2], kastP:['KAST %',a=>a.kastP*100,0], hsP:['HS %',a=>a.hsP*100,0], okP:['Opening win %',a=>a.okP*100,0]};
  const [lab, fn, dec] = defs[key];
  const pts = ms.map(m => ({m, v: fn(agg([m], side))})).filter(p => isFinite(p.v));
  if(!pts.length) return '<div class="empty">Nessun dato</div>';
  const W=720,H=220,pl=70,pr=70,pt=14,pb=28;
  const vs = pts.map(p=>p.v); let lo=Math.min(...vs), hi=Math.max(...vs); if(lo===hi){lo-=1;hi+=1;} const pad=(hi-lo)*.15; lo-=pad; hi+=pad;
  const X = i => pl + (pts.length===1 ? (W-pl-pr)/2 : i*(W-pl-pr)/(pts.length-1));
  const Y = v => pt + (1-(v-lo)/(hi-lo))*(H-pt-pb);
  const avg = vs.reduce((a,b)=>a+b,0)/vs.length;
  let g=''; for(let i=0;i<=3;i++){ const v=lo+(hi-lo)*i/3; g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" fill="var(--ink-3)" font-size="11">${v.toFixed(dec)}</text>`; }
  const path = pts.map((p,i)=>`${i?'L':'M'}${X(i)} ${Y(p.v)}`).join('');
  const dots = pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="6" fill="${p.m.result==='W'?'var(--good)':'var(--bad)'}" stroke="var(--surface)" stroke-width="2" ${tipAttr('#'+idxOf(p.m)+' '+mapName(p.m.map)+' · '+p.m.score.us+'-'+p.m.score.them+' · '+lab+' '+p.v.toFixed(dec))}/>
    <text x="${X(i)}" y="${H-8}" text-anchor="middle" fill="var(--ink-3)" font-size="11">#${idxOf(p.m)} ${esc(mapName(p.m.map))}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Andamento ${lab}">${g}
    <line x1="${pl}" x2="${W-pr}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="var(--accent)" stroke-dasharray="4 4" opacity=".7"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${dots}</svg>
    <div class="legend"><span><span class="dot" style="background:var(--good)"></span> Vinta</span><span><span class="dot" style="background:var(--bad)"></span> Persa</span><span>Linea tratteggiata: media ${avg.toFixed(dec)}</span></div>`;
}

function profileCard(){
  if(!LITE || !PROFILE) return '';
  const P = PROFILE, F = P.faceit, R = P.premier;
  const box = (lab, val, sub) => `<div class="card kpi"><div class="lab">${lab}</div><div class="val">${val}</div><div class="ref">${sub||'&nbsp;'}</div></div>`;
  return `<div class="grid kpis">
    ${F&&F.elo&&F.elo!=='?'?box('FACEIT', `Lv ${esc(String(F.level))} · ${esc(String(F.elo))}`, `ELO · agg. ${esc(F.updated||'')} · <a href="https://www.faceit.com/en/players/${encodeURIComponent(F.nick||'')}" target="_blank" rel="noopener noreferrer">profilo</a>`):''}
    ${R?box('Premier', esc(String(R.rating)), `rating · agg. ${esc(R.updated||'')}`):''}

function viewPanoramica(ms){
  const side = state.fSide, A = agg(ms, side), U = utilAgg(ms, side);
  const adv = state.mode==='adv';
  const k = [
    kpi('Rating (stima)', f1(A.rating,2), 'rif. '+REF.rating.toFixed(2), cmpClass(A.rating,REF.rating)),
    kpi('K/D', f1(A.kd,2), `${A.k} kill · ${A.d} morti`, cmpClass(A.kd,REF.kd)),
    kpi('ADR', f1(A.adr,0), 'rif. '+REF.adr, cmpClass(A.adr,REF.adr)),
    kpi('KAST', pc(A.kastP), 'rif. '+pc(REF.kastP), cmpClass(A.kastP,REF.kastP)),
    kpi('HS %', pc(A.hsP), 'rif. '+pc(REF.hsP), cmpClass(A.hsP,REF.hsP)),
    kpi('Partite vinte', `${A.mw}/${A.n}`, side==='all'?'':'(esito partita)'),
    kpi('Round vinti', pc(A.rwP), `${A.rw} su ${A.R}`, cmpClass(A.rwP,REF.rwP))
  ];
  if(adv) k.push(
    kpi('Duelli d\'apertura', pc(A.okP), `${A.ok} vinti · ${A.od} persi`, cmpClass(A.okP,REF.okP)),
    kpi('Morti tradate', pc(A.trP), `${A.trD} su ${A.d} · rif. ${pc(REF.trP)}`, cmpClass(A.trP,REF.trP)),
    kpi('Trade kill', A.tk, 'kill dopo la morte di un compagno'),
    kpi('Clutch', `${A.clW}/${A.clA}`, 'vinti / tentati'),
    kpi('Round con 3+ kill', A.mk[3]+A.mk[4]+A.mk[5], `2K: ${A.mk[2]} · 3K: ${A.mk[3]} · 4K+: ${A.mk[4]+A.mk[5]}`),

    kpi('Danni utility', f1(U.heD+U.moD,0), `HE ${f1(U.heD,0)} · molotov ${f1(U.moD,0)}`)

  // per map
  const maps = [...new Set(ms.map(m=>m.map))];
  const mrows = maps.map(mp => { const mm = ms.filter(m=>m.map===mp), a = agg(mm, side), c = agg(mm,'CT'), t = agg(mm,'T');

  // side

        const k=sum(rs,r=>r.k), d=sum(rs,r=>r.d), dm=sum(rs,r=>r.dmg); return `<tr><td>${n}</td><td>${rs.length}</td><td>${pc(sum(rs,r=>r.won?1:0)/Math.max(1,rs.length))}</td><td>${f1(k/Math.max(1,d),2)}</td><td>${f1(dm/Math.max(1,rs.length),0)}</td></tr>`;}).join('')}</tbody></table></div></div>`;
    // timing

    for(const m of ms){ for(const e of m.me.kills) if(sideOk(side,e)) kc[bk.findIndex(b=>e.t>=b[0]&&e.t<b[1])]++; for(const e of m.me.deaths) if(sideOk(side,e)&&!e.teamkill) dc[bk.findIndex(b=>e.t>=b[0]&&e.t<b[1])]++; }

      ${bk.map((b,i)=>`<div class="hrow"><span>${b[0]}${b[1]>=999?'+':'-'+b[1]} s</span><div><div class="bar" ${tipAttr(kc[i]+' kill')}><i style="width:${kc[i]/mx*100}%;background:var(--good)"></i></div><div class="bar" style="margin-top:3px" ${tipAttr(dc[i]+' morti')}><i style="width:${dc[i]/mx*100}%;background:var(--bad)"></i></div></div><span class="n">${kc[i]} / ${dc[i]}</span></div>`).join('')}</div>`;

  </div>

}

function liteCard(){
  if(!state.lite.length || state.fMap!=='all') return '';
  const L = state.lite.filter(l => state.fRes==='all' || l.result===state.fRes);
  const rows = L.map(l => `<tr><td>${dShort(l.played)}</td><td><span class="pill ${l.result}">${l.score.us}-${l.score.them}</span></td><td>${l.k}</td><td>${l.a}</td><td>${l.d}</td><td>${f1(l.k/Math.max(1,l.d),2)}</td><td>${pc(l.k?l.hs/l.k:NaN)}</td><td>${l.mvp}</td><td>${f1(l.rating,2)}</td><td>${Math.round(l.duration/60)} min</td></tr>`).join('');
  return `<div class="card"><h2>Partite senza demo</h2><div class="sub">Dati dal tabellone salvato da CS2 (file .info): risultato, kill, assist, morti, headshot e MVP. Mancano mappa, ADR, smoke e posizioni, perché servono i dati della demo. Il rating è una stima senza ADR.</div>
    <div class="scroll"><table><thead><tr><th>Data</th><th>Score</th><th>K</th><th>A</th><th>D</th><th>K/D</th><th>HS%</th><th>MVP</th><th>Rating</th><th>Durata</th></tr></thead><tbody>${rows}</tbody></table></div>${L.length?'':'<div class="empty">Nessuna partita con questi filtri.</div>'}</div>`;
}
function liteNote(){
  if(LITE || !state.lite.length) return '';

  const w = all.filter(x=>x.res==='W').length, k = sum(all,x=>x.k), d = sum(all,x=>x.d);
  return `<div class="note">Contando anche le partite senza demo il tuo storico è di ${all.length} partite: ${w} vinte, ${all.length-w} perse, K/D ${f1(k/Math.max(1,d),2)}. I numeri qui sotto usano solo le ${state.matches.length} con demo. Le altre sono nella scheda Partite.</div>`;
}
function viewPartite(ms){

  }

  if(adv) cols.push(['ok','Apertura'],['tr','Trade'],['cl','Clutch'],['ef','Flash']);

  const body = rows.map(r => `<tr class="click" data-match="${r.m.id}"><td>${r.idx}</td><td>${dShort(r.played)}</td><td>${r.map}</td><td><span class="pill ${r.m.result}">${r.m.score.us}-${r.m.score.them}</span></td><td>${f1(r.rating,2)}</td><td>${r.k}</td><td>${r.a}</td><td>${r.d}</td><td>${f1(r.kd,2)}</td><td>${f1(r.adr,0)}</td><td>${pc(r.hs)}</td><td>${pc(r.kast)}</td>${adv?`<td>${pc(r.ok)}</td><td>${pc(r.tr)}</td><td>${r.cl}</td><td>${r.ef}</td>`:''}</tr>`).join('');
  return `<div class="card"><h2>Storico partite</h2><div class="sub">Clicca una partita per scoreboard, round per round e mappa. Le più recenti sono in alto (clicca un'intestazione per cambiare l'ordine). Se non c'è il file .info accanto alla demo, la data non è disponibile e l'ordine è approssimativo.</div>
    <div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${body || ''}</tbody></table></div>${rows.length?'':'<div class="empty">Nessuna partita con questi filtri.</div>'}</div>${liteCard()}`;

function matchAnalysis(m){
  const me = m.players.find(p=>p.sid===SID); if(!me) return '<div class="empty">Giocatore non trovato nella partita.</div>';
  const mates = m.players.filter(p=>p.mine_team), foes = m.players.filter(p=>!p.mine_team), sc = m.score, R = me.rounds||1;
  const adr = p=>p.damage/p.rounds, kastP = p=>p.kast/p.rounds, hsP = p=>p.kills?p.hs/p.kills:NaN;
  const others = state.matches.filter(x=>x!==m).map(x=>x.players.find(p=>p.sid===SID)).filter(Boolean);
  const base = f => { const a = others.map(f).filter(isFinite); return a.length ? sum(a)/a.length : NaN; };
  const mt = mates.filter(p=>p!==me), avgM = f => mt.length ? sum(mt,f)/mt.length : NaN, avgF = f => sum(foes,f)/Math.max(1,foes.length);
  const rank = f => 1 + mates.filter(p=>f(p)>f(me)).length;
  const good = [], bad = [], info = [];
  const G = (t,d)=>good.push({t,d}), B = (t,d,id)=>bad.push({t,d,id});
  const bl = (f,fmt) => { const b = base(f); return isFinite(b) ? ` (tua media nelle altre ${others.length} partite: ${fmt(b)})` : ''; };
  /* result and team */
  const won = m.result==='W';
  /* rating / impact */
  if(me.rating>=1.1) G('Rating alto', `${f1(me.rating,2)}, ${rank(p=>p.rating)}° della tua squadra (media compagni ${f1(avgM(p=>p.rating),2)}).`);
  else if(me.rating<0.9) B('Rating basso', `${f1(me.rating,2)}, ${rank(p=>p.rating)}° della tua squadra (media compagni ${f1(avgM(p=>p.rating),2)}).`);
  else info.push(`Rating ${f1(me.rating,2)}, ${rank(p=>p.rating)}° su ${mates.length} nella tua squadra.`);
  const a = adr(me), am = avgM(adr);
  if(a>=am*1.1) G('Danni per round sopra i compagni', `ADR ${f1(a,0)} contro ${f1(am,0)} dei compagni${bl(adr,x=>f1(x,0))}.`);
  else if(a<=am*0.9) B('Pochi danni per round', `ADR ${f1(a,0)} contro ${f1(am,0)} dei compagni${bl(adr,x=>f1(x,0))}. Stai facendo meno danni del resto della squadra.`,'mira');
  const k = kastP(me);
  if(k>=0.7) G('Round in cui hai contribuito (KAST)', `${pc(k)} dei round con una kill, un assist, sopravvivenza o trade${bl(kastP,pc)}.`);
  else if(k<0.55) B('Poco contributo nei round (KAST)', `Solo ${pc(k)} dei round con kill, assist, sopravvivenza o trade${bl(kastP,pc)}.`,'notrade');
  info.push(`K/A/D ${me.kills}/${me.assists}/${me.deaths} (${me.kills-me.deaths>0?'+':''}${me.kills-me.deaths}), HS ${pc(hsP(me))}${bl(hsP,pc)}.`);
  /* side */
  for(const s of ['CT','T']){
    const sd = me.side && me.side[s], n = sc[s.toLowerCase()+'_rounds'], w = sc[s.toLowerCase()+'_won'];
    if(!sd || !n) continue;
    const kd = sd.deaths ? sd.kills/sd.deaths : sd.kills;
    info.push(`Lato ${s}: la squadra ha vinto ${w} round su ${n}; tu ${sd.kills} kill e ${sd.deaths} morti (K/D ${f1(kd,2)}). Il risultato dei round dipende da tutta la squadra, non solo da te.`);
    if(kd>=1.3 && sd.kills>=5) G(`Buon K/D da ${s}`, `${sd.kills} kill e ${sd.deaths} morti.`);
    else if(kd<=0.7 && sd.deaths>=5) B(`K/D basso da ${s}`, `${sd.kills} kill e ${sd.deaths} morti.`);
  }
  /* openings and trades */
  const ok = me.opening_kills, od = me.opening_deaths;
  if(ok+od>=2){ if(ok>od) G('Duelli di apertura vinti', `${ok} aperture vinte e ${od} perse.`); else if(od>ok) B('Duelli di apertura persi', `${ok} aperture vinte e ${od} perse: primo morto del round ${od} volte.`,'entry'); }
  const tr = me.deaths ? me.deaths_traded/me.deaths : NaN;
  if(me.deaths>=5){ if(tr<0.25) B('Morti quasi mai tradate', `Solo ${me.deaths_traded} morti su ${me.deaths} (${pc(tr)}) sono state vendicate da un compagno (tuo riferimento: ~25-30%).`,'notrade'); else if(tr>=0.4) G('Morti tradate', `${me.deaths_traded} morti su ${me.deaths} (${pc(tr)}) vendicate da un compagno.`); }
  if(me.trade_kills>=2) G('Hai tradato i compagni', `${me.trade_kills} trade kill.`);
  if(me.clutch_att>0){ if(me.clutch_won>0) G('Clutch', `${me.clutch_won} vinti su ${me.clutch_att}.`); else B('Clutch persi', `0 vinti su ${me.clutch_att} (${m.me.clutches.map(c=>`round ${c.r} 1v${c.vs}`).join(', ')}): ricorda di giocare il tempo e di isolare un duello per volta.`); }
  if(me.mk3+me.mk4+me.mk5>=1) G('Multikill', `${me.mk2} doppiette, ${me.mk3} triple, ${me.mk4} quadruple, ${me.mk5} ace.`);
  /* utility */
  const tf = me.thrown_flash, ef = me.enemies_flashed;
  if(tf>=2){ if(ef/tf>=1.5) G('Flash efficaci', `${ef} nemici accecati con ${tf} flash (${f1(me.enemy_flash_time,1)} s totali).`); else if(ef<tf) B('Flash poco efficaci', `${ef} nemici accecati con ${tf} flash; hai accecato ${me.team_flashed} compagni (${f1(me.team_flash_time,1)} s).`,'util'); }
  if(me.team_flashed>ef && me.team_flashed>=3) B('Hai accecato i compagni', `${me.team_flashed} volte (${f1(me.team_flash_time,1)} s) contro ${ef} nemici.`,'util');
  if(me.team_damage>=40) B('Danni ai compagni', `${f1(me.team_damage,0)} danni a compagni.`);
  info.push(`Utility lanciate: ${me.thrown_smoke} smoke, ${me.thrown_flash} flash, ${me.thrown_he} HE, ${me.thrown_molotov} molotov; danni da HE+molotov ${f1(me.dmg_he+me.dmg_molotov,0)}.`);
  /* weapons */
  for(const w of m.me.weapons.filter(w=>w.shots>=60).slice(0,2)){
    const acc = w.hits/w.shots, all = state.matches.flatMap(x=>x.me.weapons.filter(y=>y.w===w.w)), s = sum(all,y=>y.shots), h = sum(all,y=>y.hits), ref = s>w.shots+60 ? (h-w.hits)/(s-w.shots) : NaN;
    const txt = `${wname(w.w)}: ${w.hits}/${w.shots} colpi a segno (${pc(acc)}), ${w.kills} kill, ${w.hs_hits} in testa.`;
    if(isFinite(ref)){ if(acc>=ref*1.2) G(`Precisione alta con ${wname(w.w)}`, `${txt} Tua media nelle altre partite: ${pc(ref)}.`); else if(acc<=ref*0.8) B(`Precisione bassa con ${wname(w.w)}`, `${txt} Tua media nelle altre partite: ${pc(ref)}.`,'corsa'); else info.push(txt); }
    else info.push(txt);
  }
  /* movement */
  const mv = m.me.mov;
  if(mv){ const tot = sum(['st','sl','mv'],b=>mv.all[b][0]), stP = tot?mv.all.st[0]/tot:NaN, mvP = tot?mv.all.mv[0]/tot:NaN;
    if(tot>=60){ if(mvP>0.25) B('Spari troppo in movimento', `${pc(mvP)} dei colpi in movimento (centrati ${mv.all.mv[0]?pc(mv.all.mv[1]/mv.all.mv[0]):'–'}) contro ${pc(stP)} da fermo (centrati ${mv.all.st[0]?pc(mv.all.st[1]/mv.all.st[0]):'–'}).`,'corsa'); else if(stP>=0.5) G('Spari da fermo', `${pc(stP)} dei colpi da fermo (centrati ${mv.all.st[0]?pc(mv.all.st[1]/mv.all.st[0]):'–'}).`); } }
  /* economy */
  const rs = m.rounds, adv = rs.filter(r=>r.team_equip>=r.enemy_equip*1.3 && r.r!==1 && r.r!==13), dis = rs.filter(r=>r.team_equip*1.3<=r.enemy_equip && r.r!==1 && r.r!==13);
  const advL = adv.filter(r=>!r.won), disW = dis.filter(r=>r.won);
  if(advL.length>=2) B('Round persi con vantaggio economico', `Round ${advL.map(r=>r.r).join(', ')}: la squadra aveva almeno il 30% di equipaggiamento in più e ha perso (${adv.length-advL.length} vinti su ${adv.length} con vantaggio).`);
  if(disW.length>=1) G('Round vinti in svantaggio economico', `Round ${disW.map(r=>r.r).join(', ')} (${disW.length} su ${dis.length}).`);
  /* survival and deaths */
  const lostAlive = rs.filter(r=>!r.won && r.survived);
  if(lostAlive.length) info.push(`Hai finito vivo ${lostAlive.length} round persi (${lostAlive.map(r=>r.r).join(', ')}): controlla se erano salvataggi voluti o se potevi aiutare.`);
  const D = m.me.deaths.filter(e=>!e.teamkill), early = D.filter(e=>e.t<30);
  if(D.length>=5 && early.length/D.length>0.5) B('Muori troppo presto', `${early.length} morti su ${D.length} nei primi 30 s del round.`,'presto');
  /* causes of death */
  const withC = D.filter(e=>e.c), rev = withC.map(e=>({e, rev:reviewDeath(e)}));
  const nFight = rev.filter(x=>x.rev.some(r=>r.id==='scontro')).length; if(withC.length) info.push(`In ${nFight} morti su ${withC.length} eri in pieno scontro (kill appena fatta o compagno caduto vicino): non sono conteggiate come errori di reazione.`);
  const cnt = {}; for(const x of rev) for(const id of new Set(x.rev.map(r=>r.id))) cnt[id] = (cnt[id]||0)+1;
  const causes = Object.keys(cnt).filter(k=>k!=='ok'&&k!=='scontro').sort((a,b)=>cnt[b]-cnt[a]).slice(0,3);
  for(const id of causes) if(id!=='scontro' && cnt[id]>=2 && !bad.some(b=>b.id===id)) B(ECAT[id], `${cnt[id]} morti su ${withC.length} analizzate in questa partita.`, id);
  /* data check */

  const row = (lab, a, b) => chk.push(`<tr><td>${lab}</td><td>${a}</td><td>${b}</td><td>${a===b?'<span class="up">✓</span>':'<span class="down">⚠ differenza</span>'}</td></tr>`);
  row('Kill: eventi registrati / scoreboard', m.me.kills.length, me.kills);

  row('Morti: somma dei round / scoreboard', sum(rs,r=>r.d), me.deaths);
  row('Round giocati / punteggio', rs.length, sc.us+sc.them);
  row('Danni: somma dei round / scoreboard', Math.round(sum(rs,r=>r.dmg)), Math.round(me.damage));
  const ctxN = m.me.deaths.filter(e=>e.c).length;
  const tbl = rev.length ? `<div class="scroll"><table><thead><tr><th>Round</th><th>Lato</th><th>Tempo</th><th>Punto</th><th>Killer</th><th>Arma · dist.</th><th>Tradata</th><th>Segnali</th></tr></thead><tbody>${rev.map(({e,rev:rv})=>`<tr><td>${e.r}</td><td>${e.side}</td><td>${e.t} s</td><td>${esc(e.c.pl||'?')}</td><td>${esc(e.killer)}</td><td>${esc(wname(e.w))} · ${f1(e.dist,0)} m</td><td>${e.traded?'sì':'no'}</td><td style="text-align:left;white-space:normal">${rv.map(r=>esc(r.title)).join('; ')}</td></tr>`).join('')}</tbody></table></div>` : `<div class="sub">Il dettaglio delle morti non è disponibile per questa partita (la demo era già stata cancellata prima dell'analisi di contesto).</div>`;
  const li = a => a.map(x=>`<li style="margin:6px 0"><b>${esc(x.t)}.</b> ${esc(x.d)}</li>`).join('');
  const prior = bad.slice(0,3).map(b=>b.id && DRILL[b.id] ? `<li style="margin:6px 0"><b>${esc(b.t)}:</b> ${esc(DRILL[b.id])}</li>` : `<li style="margin:6px 0"><b>${esc(b.t)}:</b> riguarda i round indicati nella scheda "Round per round" e cerca la causa.</li>`).join('');

  ${prior?`<div class="card"><h2>Su cosa lavorare dopo questa partita</h2><ul style="margin:6px 0 0;padding-left:20px">${prior}</ul></div>`:''}
  <div class="card"><h2>Altri dati della partita</h2><ul style="margin:6px 0 0;padding-left:20px">${info.map(x=>`<li style="margin:4px 0">${esc(x)}</li>`).join('')}</ul></div>
  <div class="card"><h2>Le tue morti, una per una</h2><div class="sub">Il dettaglio con mappa e tattica è nella scheda "Errori e fix".</div>${tbl}</div>
  <div class="card"><h2>Verifica dei dati</h2><div class="sub">Controllo che le diverse fonti dentro la demo diano gli stessi numeri${tk?` (${tk} morti da fuoco amico incluse negli eventi)`:''}. Dettaglio contesto morti: ${ctxN}/${m.me.deaths.length}.</div>
    <table><thead><tr><th>Controllo</th><th>Valore A</th><th>Valore B</th><th>Esito</th></tr></thead><tbody>${chk.join('')}</tbody></table></div>`;
}

<script>
/* Economy review: buy types, loss-bonus streaks, force-buy chains, anti-eco, drops */
const RIFLE = new Set(['ak47','m4a1','m4a1_silencer','m4a4','galilar','famas','aug','sg556']);
const SMGW = new Set(['mp9','mac10','mp7','mp5sd','ump45','bizon']);
const tierOf = (avg, pistol) => pistol ? 'Pistol' : avg < 1500 ? 'Eco' : avg < 3800 ? 'Semi/Force' : 'Full buy';
const WLONG = {ak47:'AK-47',m4a1:'M4A1',m4a1silencer:'M4A1-S',m4a4:'M4A4',galilar:'Galil',famas:'FAMAS',aug:'AUG',sg556:'SG 553',awp:'AWP',ssg08:'SSG 08',scar20:'SCAR-20',g3sg1:'G3SG1',mp9:'MP9',mac10:'MAC-10',mp7:'MP7',mp5sd:'MP5-SD',ump45:'UMP-45',bizon:'PP-Bizon',p90:'P90',nova:'Nova',xm1014:'XM1014',mag7:'MAG-7',sawedoff:'Sawed-Off',negev:'Negev',m249:'M249',deagle:'Deagle',p250:'P250',fiveseven:'Five-SeveN',tec9:'Tec-9',cz75a:'CZ75',elite:'Dual Berettas',revolver:'R8',glock:'Glock',hkp2000:'P2000',usps:'USP-S',uspsilencer:'USP-S'};
const PRIMARY = new Set(['ak47','m4a1','m4a1silencer','m4a4','galilar','famas','aug','sg556','awp','ssg08','scar20','g3sg1','mp9','mac10','mp7','mp5sd','ump45','bizon','p90','nova','xm1014','mag7','sawedoff','negev','m249']);
const SMG_ONLY = new Set(['mp9','mac10','mp7','mp5sd','ump45','bizon','p90','nova','xm1014','mag7','sawedoff']);
const RIF_ONLY = new Set(['ak47','m4a1','m4a1silencer','m4a4','galilar','famas','aug','sg556']);
function buyInfo(b){
  if(!b) return null;
  const inv = b.inv||[], prim = inv.find(i=>PRIMARY.has(i)), pist = inv.filter(i=>WLONG[i]&&!PRIMARY.has(i));
  const g = {fl:inv.filter(i=>i==='flashbang').length, sm:inv.filter(i=>i==='smokegrenade').length, he:inv.filter(i=>i==='hegrenade').length, mo:inv.filter(i=>i==='molotov'||i==='incgrenade').length};
  const ng = g.fl+g.sm+g.he+g.mo;
  const arm = b.ar>0 ? (b.hel?'giubbotto+elmetto':'solo giubbotto') : 'nessuna armatura';
  const parts = [prim?WLONG[prim]:(pist[0]?WLONG[pist[0]]+' (pistola)':'solo coltello'), arm, ...(b.kit?['kit']:[]), ng?`${ng} granate (${[g.fl&&g.fl+' flash',g.sm&&'smoke',g.he&&'HE',g.mo&&'molotov'].filter(Boolean).join(', ')})`:'nessuna granata'];
  return {prim, ng, g, arm, hasArm:b.ar>0, txt:parts.join(' · '), st:b.st, sp:b.sp, mo:b.mo};
}
function econMatch(m){
  const rs = m.rounds.slice().sort((a,b)=>a.r-b.r), out = [];
  let meter = 1, prevHalf = null;
  for(let i=0;i<rs.length;i++){
    const r = rs[i];
    if(r.half !== prevHalf){ meter = 1; prevHalf = r.half; }          // the streak restarts at half time
    const pistol = (r.r===1 || r.r===13);
    const nT = Math.max(1, m.players.filter(p=>p.mine_team).length) , nE = Math.max(1, m.players.filter(p=>!p.mine_team).length);
    const tAvg = r.team_equip/nT, eAvg = r.enemy_equip/nE, oAvg = nT>1 ? (r.team_equip - r.equip)/(nT-1) : 0;
    const x = {r, i, pistol, meter, bonus: 1400+500*meter, tAvg, eAvg, oAvg, tier: tierOf(tAvg,pistol), eTier: tierOf(eAvg,pistol), flags: []};
    // unspent money (at the end of the buy phase) while teammates are short
    if(!pistol && r.money >= 2700 && oAvg < 3000) x.flags.push({id:'drop', bad:true});
    if(!pistol && r.equip >= 3800 && oAvg < 2000) x.flags.push({id:'lone', bad:true});
    if(!pistol && r.equip < 1500 && oAvg >= 3800 && r.money >= 3000) x.flags.push({id:'broke_rich', bad:true});
    const bi = buyInfo(r.buy); x.bi = bi;
    if(bi){
      const tm = r.buy.tm||[];
      if(!pistol && bi.prim && !bi.hasArm && bi.sp>=2000) x.flags.push({id:'noarmor', bad:true});
      if(!pistol && x.tier==='Full buy' && bi.prim && RIF_ONLY.has(bi.prim) && bi.ng===0) x.flags.push({id:'noutil', bad:true});
      if(!pistol && bi.prim==='awp' && x.tier!=='Full buy') x.flags.push({id:'awpeco', bad:true});
      if(tm.length){
        const short = tm.filter(([eq,mo])=>eq<2000).length;
        x.short = short; x.mateMoney = tm.map(a=>a[1]);
        const idx = x.flags.findIndex(f=>f.id==='drop'||f.id==='lone');
        if(idx>=0 && x.flags[idx].id==='drop' && short===0) x.flags.splice(idx,1);       // nobody is short: no drop to make
        if(!pistol && bi.mo>=2700 && short>=1 && !x.flags.some(f=>f.id==='drop')) x.flags.push({id:'drop', bad:true});
      }
    }
    out.push(x);
    meter = r.won ? Math.max(0, meter-1) : Math.min(4, meter+1);
  }
  // sequences
  for(let i=1;i<out.length;i++){
    const a = out[i-1], b = out[i];
    if(!a.pistol && !b.pistol && a.tier==='Semi/Force' && b.tier==='Semi/Force' && !a.r.won && !b.r.won && a.r.half===b.r.half) b.flags.push({id:'forcechain', bad:true});
    if(!a.r.won && a.bonus>=2900 && b.tier==='Semi/Force' && !b.pistol && b.r.half===a.r.half && !b.r.won) b.flags.push({id:'forcehigh', bad:true, pb:a.bonus});
    if(a.r.half===b.r.half && !a.r.won && a.tier==='Eco' && b.tier==='Full buy' && b.r.won) b.flags.push({id:'ecook', bad:false});
  }
  // anti-eco: enemies on eco and we are not
  for(const x of out){
    const r = x.r;
    if(!x.pistol && x.eTier==='Eco' && x.tier!=='Eco'){
      const ks = m.me.kills.filter(e=>e.r===r.r), rifk = ks.filter(e=>RIFLE.has(e.w)).length, smgk = ks.filter(e=>SMGW.has(e.w)).length;
      x.anti = {rifk, smgk, n: ks.length};
      if(rifk) x.flags.push({id:'antieco_rifle', bad:true, n:rifk});
    }
    if(!r.won && r.survived && r.equip>=3000) x.flags.push({id:'saved', bad:false});
    if(x.eTier==='Full buy' && x.tier==='Eco' && r.won) x.flags.push({id:'ecowin', bad:false});
    if(x.eTier==='Eco' && x.tier!=='Eco' && !x.pistol && !r.won) x.flags.push({id:'antieco_lost', bad:true});
  }
  return out;
}
const ECOTXT = {
  drop:  x => x.short!=null ? `Avevi ${x.bi.mo}$ non spesi e ${x.short} compagni sotto 2000$ di equipaggiamento: potevi fare drop di un'arma.` : `Avevi ${x.r.money}$ non spesi mentre i compagni avevano in media circa ${Math.round(x.oAvg)}$ di equipaggiamento.`,
  lone:  x => `Hai fatto un full buy (${x.r.equip}$) con compagni a circa ${Math.round(x.oAvg)}$: un fucile da solo vince raramente il round.`,
  broke_rich: x => `Squadra in full buy (compagni circa ${Math.round(x.oAvg)}$) e tu con ${x.r.money}$ in tasca e solo ${x.r.equip}$ di equipaggiamento.`,
  forcechain: x => `Seconda force di fila persa: due round a spendere tutto senza ottenere il full buy.`,
  forcehigh: x => `Force dopo una sconfitta che aveva già dato ${x.pb}$ di loss bonus: risparmiando un round il full buy era più vicino.`,
  ecook: x => `Dopo un eco hai vinto il full buy successivo: il risparmio ha pagato.`,
  antieco_rifle: x => `Contro un eco hai ucciso con il fucile ${x.n} volte (300$ a kill): con un SMG sarebbero stati 600$ a kill.`,
  antieco_lost: x => `Round perso contro una squadra in eco: è il più costoso dal punto di vista dell'economia (regala armi e bonus).`,
  saved: x => `Round perso ma sei sopravvissuto con ${x.r.equip}$ di equipaggiamento: arma salvata per il round dopo.`,
  noarmor: x => `Hai comprato l'arma (${x.bi.txt.split(' · ')[0]}) senza armatura: l'armatura va comprata per prima in ogni round di acquisto.`,
  noutil: x => `Full buy senza nessuna granata: smoke e flash servono per entrare o difendere con il trade.`,
  awpeco: x => `AWP in un round non da full buy: rende solo 100$ a kill e se la perdi regali 4750$.`,
  ecowin: x => `Round vinto in eco contro un full buy nemico: ottima resa economica (armi nemiche e blocco del loss bonus).`
};
function econSummary(m){
  const E = econMatch(m), T = {}, cnt = {};
  for(const x of E){ const k = x.tier; (T[k] = T[k]||{n:0,w:0}); T[k].n++; if(x.r.won) T[k].w++; for(const f of x.flags) cnt[f.id] = (cnt[f.id]||0)+1; }
  const lost = E.filter(x=>!x.r.won), rich = sum(lost, x=>x.r.money);
  const maxStreak = (()=>{ let c=0,mx=0; for(const x of E){ c = x.r.won?0:c+1; mx=Math.max(mx,c); } return mx; })();
  const anti = E.filter(x=>x.anti), antiW = anti.filter(x=>x.r.won).length;
  return {E, T, cnt, rich, maxStreak, anti, antiW};
}
function econCards(m){
  const S = econSummary(m), {E,T,cnt} = S;
  const good = [], bad = [], info = [];
  const rl = id => E.filter(x=>x.flags.some(f=>f.id===id)).map(x=>x.r.r).join(', ');
  const tr = k => T[k] ? `${T[k].w}/${T[k].n}` : '–';
  if(cnt.drop) bad.push(['Soldi non spesi mentre la squadra era corta', `Round ${rl('drop')}: avevi 2700$ o più a fine acquisti e i compagni erano sotto i 3000$ di media. I soldi in tasca valgono zero se perdi: compra o dai un'arma a chi è corto (drop).`, ['eco2','eco4','eco5']]);
  if(cnt.noarmor) bad.push(['Arma senza armatura', `Round ${rl('noarmor')}: hai comprato l'arma ma non l'armatura. La regola dei coach è armatura prima di tutto: senza, ti uccidono con meno colpi e il nemico incassa lo stesso.`, ['eco2']]);
  if(cnt.noutil) bad.push(['Full buy senza granate', `Round ${rl('noutil')}: nessuna utility con un full buy. Almeno una smoke e una flash.`, ['eco1','eco2']]);
  if(cnt.awpeco) bad.push(['AWP in round non pieno', `Round ${rl('awpeco')}: l'AWP costa 4750$ e rende solo 100$ per kill.`, ['eco2']]);
  if(cnt.lone) bad.push(['Full buy da solo', `Round ${rl('lone')}: ti sei equipaggiato a pieno con la squadra in eco o semi-eco. Con la squadra sotto i 2000$ di media allinea l'acquisto agli altri o fai drop.`, ['eco2']]);
  if(cnt.forcechain) bad.push(['Force di fila senza risultato', `Round ${rl('forcechain')}: due semi-buy o force consecutive, entrambe perse. Dopo la prima sconfitta il caso migliore era un eco per tornare a un full buy.`, ['eco2','eco3']]);
  if(cnt.forcehigh) bad.push(['Force con loss bonus alto', `Round ${rl('forcehigh')}: dopo una sconfitta il bonus era già a 2900$ o più e la squadra ha forzato; con un eco il full buy per tutti sarebbe stato più vicino (conta anche quanto avevano i compagni, che qui non è visibile).`, ['eco2','eco3']]);
  if(S.anti.length){
    const rifk = sum(S.anti, x=>x.anti.rifk), smgk = sum(S.anti, x=>x.anti.smgk);
    if(rifk) bad.push(['Fucile contro eco', `In ${S.anti.length} round contro squadre in eco hai fatto ${rifk} kill con il fucile (300$) e ${smgk} con SMG (600$). Contro un eco un SMG uccide altrettanto bene e rende il doppio per kill (+${rifk*300}$ in questa partita).`, ['eco1','eco2']]);
    info.push(`Round contro squadre in eco: ${S.antiW} vinti su ${S.anti.length}. Perderli è la causa più costosa di economia: regalano armi e bonus.`);
  }
  if(cnt.antieco_lost) bad.push(['Round persi contro un eco', `Round ${rl('antieco_lost')}: contro un eco non serve forzare i duelli, servono spazio e trade; muori e regali un'arma.`, ['eco1','eco2']]);
  if(cnt.saved) good.push(['Armi salvate', `Round ${rl('saved')}: sei sopravvissuto con equipaggiamento da full buy a round perso, così il round dopo parti già con l'arma.`, ['eco5']]);
  if(cnt.ecowin) good.push(['Eco vinti contro un full buy', `Round ${rl('ecowin')}.`, ['eco1']]);
  if(cnt.ecook) good.push(['Eco che hanno pagato', `Round ${rl('ecook')}: dopo un eco hai vinto il full buy.`, ['eco1']]);
  const p = E.filter(x=>x.pistol);
  for(const x of p){ const nx = E[x.i+1]; if(nx && nx.r.half===x.r.half){ (x.r.won ? good : info).push(x.r.won ? ['Pistol vinto', `Round ${x.r.r} vinto. Round ${nx.r.r} (${nx.tier}, nemici ${nx.eTier}): ${nx.r.won?'vinto, hai convertito il vantaggio':'perso: il pistol vinto va convertito con una buona anti-eco'}.`, ['eco1','eco3']] : `Pistol perso (round ${x.r.r}): il round dopo la squadra era ${nx.tier}${nx.tier==='Eco'?' (scelta corretta con il loss bonus in crescita)':''}, esito ${nx.r.won?'vinto':'perso'}.`); } }
  if(S.maxStreak>=4) info.push(`Striscia massima di round persi: ${S.maxStreak}. Con 5 sconfitte il bonus arriva al massimo (3400$): i round dopo sono pieni, il problema è non vincere quelli a bonus basso.`);
  const li = a => a.map(([h,b,s])=>`<div class="iss ${a===good?'ok':'media'}"><h4>${h}</h4><p>${b}</p><p class="sub">Fonti: ${(s||[]).map(k=>`<a href="${SRC[k][1]}" target="_blank" rel="noopener noreferrer">${esc(SRC[k][0].split(' (')[0])}</a>`).join(' · ')}</p></div>`).join('');
  const tiers = ['Pistol','Eco','Semi/Force','Full buy'].map(k=>`<tr><td>${k}</td><td>${T[k]?T[k].n:0}</td><td>${T[k]?pc(T[k].w/T[k].n):'–'}</td></tr>`).join('');
  const rows = E.map(x=>{ const r = x.r, fl = x.flags.map(f=>`<span class="pill ${f.bad?'L':'W'}" title="${esc(ECOTXT[f.id](Object.assign({n:f.n},x)))}">${({drop:'soldi non spesi',noarmor:'senza armatura',noutil:'senza utility',awpeco:'AWP in eco',lone:'full da solo',broke_rich:'sotto-equipaggiato',forcechain:'force di fila',forcehigh:'force con bonus alto',ecook:'eco ok',antieco_rifle:'fucile vs eco',antieco_lost:'perso vs eco',saved:'arma salvata',ecowin:'eco vinto'})[f.id]}</span>`).join(' ');
    return `<tr><td>${r.r}</td><td><span class="side ${r.side}">${r.side}</span></td><td><span class="pill ${r.won?'W':'L'}">${r.won?'Vinto':'Perso'}</span></td><td>${x.tier}<div class="sub" style="margin:0">media ${Math.round(x.tAvg)}$ · tu ${r.equip}$</div></td><td>${x.eTier}<div class="sub" style="margin:0">media ${Math.round(x.eAvg)}$</div></td><td style="text-align:left;white-space:normal;max-width:260px">${x.bi?esc(x.bi.txt)+`<div class="sub" style="margin:0">partivi con ${x.bi.st}$, speso ${x.bi.sp}$${x.short!=null?` · compagni sotto 2000$: ${x.short}`:''}</div>`:'<span class="sub">non registrato</span>'}</td><td>${x.bi?x.bi.mo:r.money}$</td><td>${x.bonus}$</td><td style="text-align:left;white-space:normal">${fl}</td></tr>`; }).join('');
  return `<div class="card"><h2>Economia della partita</h2><div class="sub">Il valore è quello a inizio round (dopo gli acquisti). Eco sotto 1500$ di media a giocatore, semi/force fino a 3800$, full buy sopra. Sono soglie indicative del tool ricavate dalle guide sotto: il dettaglio di cosa hai comprato (armi, armatura, granate) compare solo per le partite analizzate con la versione nuova del programma, per le altre vedi “non registrato”.</div>
    <div class="grid g2"><div><table><thead><tr><th>Tipo di buy (squadra)</th><th>Round</th><th>Vinti</th></tr></thead><tbody>${tiers}</tbody></table></div>
    <div><p>• Soldi rimasti in tasca a fine acquisti, sommati sui round persi: <b>${S.rich}$</b></p><p>• Striscia massima di sconfitte: <b>${S.maxStreak}</b></p><p>• Anti-eco: <b>${S.antiW}/${S.anti.length}</b> vinti</p></div></div></div>
    ${bad.length?`<div class="card"><h2>Cosa migliorare nell'economia</h2>${li(bad)}</div>`:''}
    ${good.length?`<div class="card"><h2>Cosa è andato bene</h2>${li(good)}</div>`:''}
    ${info.length?`<div class="card"><h2>Altre note</h2>${info.map(s=>`<p>• ${s}</p>`).join('')}</div>`:''}
    <div class="card"><h2>Round per round</h2><div class="sub">Passa sopra le etichette per il dettaglio. Il loss bonus è quello che avresti incassato perdendo quel round (parte da 1900$, sale di 500$ a sconfitta fino a 3400$, scende di 500$ a vittoria, riparte a metà partita).</div>
      <div class="scroll"><table class="timeline"><thead><tr><th>#</th><th>Lato</th><th>Esito</th><th>Noi</th><th>Loro</th><th>Cosa hai comprato</th><th>Tuoi $ a fine acquisti</th><th>Loss bonus</th><th>Note</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="card"><h2>Come si ragiona sull'economia (fonti)</h2><ul style="margin:6px 0 0;padding-left:20px">
      <li>Ogni giocatore parte con 800$, massimo 16000$. Vittoria 3250$ (3500$ con bomba esplosa o disinnescata); sconfitta da 1400$ a 3400$ in base alla striscia; T che piantano e perdono incassano un bonus.</li>

      <li>Cosa guardano gli analisti: vittorie ai pistol e conversione del round dopo, resa per tipo di acquisto (eco, semi/force, full), sincronia degli acquisti, soldi non spesi nei round persi e valore economico dei round vinti da eco.</li></ul>
      <p class="sub">Alcune guide divergono su soglie esatte (il full buy va da 4000$ a 5300$ a seconda della fonte e della squadra) e una afferma che i soldi restano a metà partita: nei tuoi dati il round 13 parte con equipaggiamento da pistol, quindi qui trattato come ripartenza.</p></div>`;

function viewMatch(m){
  const sc = m.score, partial = !m.complete ? `<div class="note">Questa partita sembra incompleta (nessuna squadra ha raggiunto 13 round): potrebbe essere finita per resa o abbandono.</div>` : '';

    const mk = list => list.map(p => `<tr class="${p.sid===SID?'me':''}"><td>${esc(p.name)}</td><td>${f1(p.rating,2)}</td><td>${p.kills}</td><td>${p.assists}</td><td>${p.deaths}</td><td>${p.kills-p.deaths>0?'+':''}${p.kills-p.deaths}</td><td>${f1(p.damage/p.rounds,0)}</td><td>${pc(p.kast/p.rounds)}</td><td>${pc(p.kills?p.hs/p.kills:NaN)}</td>${adv?`<td>${p.opening_kills}-${p.opening_deaths}</td><td>${p.trade_kills}</td><td>${p.clutch_won}/${p.clutch_att}</td><td>${p.enemies_flashed}</td><td>${p.thrown_smoke}</td><td>${f1(p.dmg_he+p.dmg_molotov,0)}</td>`:''}</tr>`).join('');
    const hd = `<tr><th>Giocatore</th><th>Rating</th><th>K</th><th>A</th><th>D</th><th>+/-</th><th>ADR</th><th>KAST</th><th>HS%</th>${adv?'<th>Apertura</th><th>Trade</th><th>Clutch</th><th>Flash</th><th>Smoke</th><th>Danni util.</th>':''}</tr>`;
    body = `<div class="card"><h2>La tua squadra · ${sc.us}</h2><div class="scroll"><table><thead>${hd}</thead><tbody>${mk(m.players.filter(p=>p.mine_team))}</tbody></table></div></div>
            <div class="card"><h2>Avversari · ${sc.them}</h2><div class="scroll"><table><thead>${hd}</thead><tbody>${mk(m.players.filter(p=>!p.mine_team))}</tbody></table></div></div>`;
  } else if(state.selView==='rounds'){
    const rows = m.rounds.filter(r=>sideOk(state.fSide,r)).map(r => {
      const evs = [...m.me.kills.filter(e=>e.r===r.r).map(e=>({t:e.t, s:`<b class="up">Kill</b> ${wname(e.w)}${e.hs?' (testa)':''} su ${esc(e.victim)} · ${f1(e.dist,0)} m`})),
                   ...m.me.deaths.filter(e=>e.r===r.r).map(e=>({t:e.t, s:`<b class="down">Morte</b> da ${esc(e.killer)} con ${wname(e.w)} · ${f1(e.dist,0)} m · ${e.traded?'tradato':'non tradato'}`})),
                   ...m.me.util.filter(u=>u.r===r.r).map(u=>({t:u.t, s:`${KIND[u.kind]} lanciata`}))].sort((a,b)=>a.t-b.t);
      const buy = (r.r===1||r.r===13)?'Pistol':r.equip<1500?'Eco':r.equip<4000?'Force':'Full';
      return `<tr class="click" data-round="${r.r}"><td>${r.r}</td><td><span class="side ${r.side}">${r.side}</span></td><td><span class="pill ${r.won?'W':'L'}">${r.won?'Vinto':'Perso'}</span></td><td>${r.k}/${r.a}/${r.d}</td><td>${r.dmg}</td><td>${buy} (${r.equip}$)</td><td>${r.team_equip}$ / ${r.enemy_equip}$</td><td>${r.survived?'Vivo':'Morto'}${r.traded?' · tradato':''}</td><td>${r.len} s</td></tr>
        ${state.openRound===r.r?`<tr><td colspan="9" style="text-align:left;white-space:normal"><ul class="ev-list">${evs.map(e=>`<li>${e.t.toFixed(1)} s · ${e.s}</li>`).join('')||'<li>Nessun evento registrato</li>'}</ul></td></tr>`:''}`; }).join('');
    body = `<div class="card"><h2>Round per round</h2><div class="sub">K/A/D sono i tuoi. Equip squadra e nemici sono la somma a inizio round. Clicca un round per la sequenza.</div>
      <div class="scroll"><table class="timeline"><thead><tr><th>#</th><th>Lato</th><th>Esito</th><th>K/A/D</th><th>Danni</th><th>Buy</th><th>Equip (noi / loro)</th><th>Stato</th><th>Durata</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  } else {
    body = mapCard(m.map, [m], state.fSide, 'm');
  }
  return `<button class="btn back" data-back="1">← Tutte le partite</button>
    <div class="card"><div class="top-row"><div><h2>#${idxOf(m)} ${mapName(m.map)} <span class="pill ${m.result}">${sc.us}-${sc.them}</span></h2>
      <div class="sub">${m.played?dShort(m.played)+' · ':''}CT: ${sc.ct_won}/${sc.ct_rounds} round vinti · T: ${sc.t_won}/${sc.t_rounds} round vinti · demo ${esc(m.file.slice(0,34))}…</div></div>
      <div class="seg" id="mview">${tabs.map(([k,t])=>`<button data-v="${k}" aria-pressed="${state.selView===k}">${t}</button>`).join('')}</div></div></div>
    ${partial}${body}`;
}

/* reusable map card */
function mapCard(map, ms, side, id){
  const L = state.layers;
  const sc = mapScene(map, ms, side, L);
  const cells = zoneList(sc.pts, sc.pt);
  const grid = [];
  for(let i=0;i<=10;i++){ grid.push(`<line x1="${i*100}" y1="0" x2="${i*100}" y2="1000" stroke="#fff" stroke-opacity=".18" stroke-width="1"/><line x1="0" y1="${i*100}" x2="1000" y2="${i*100}" stroke="#fff" stroke-opacity=".18" stroke-width="1"/>`); }
  for(let i=0;i<10;i++){ grid.push(`<text x="${i*100+50}" y="22" fill="#ffd54a" font-size="22" text-anchor="middle" font-weight="700" stroke="#000" stroke-width="3" paint-order="stroke">${i+1}</text><text x="12" y="${i*100+58}" fill="#ffd54a" font-size="22" font-weight="700" stroke="#000" stroke-width="3" paint-order="stroke">${i+1}</text>`); }
  for(const c of cells) grid.push(`<rect class="zc" data-zr="${c.cx}-${c.cy}" x="${c.cx*100}" y="${c.cy*100}" width="100" height="100" fill="#ffd54a" fill-opacity="0" stroke="#ffd54a" stroke-opacity="0" stroke-width="4" pointer-events="none"/>`);
  const svg = radarSVG(map, [...sc.sh, ...grid]);
  const kc = sc.kills.length, dc = sc.deaths.length;
  const zones = cells.map(c => {
    const kd = c.d ? c.k/c.d : c.k;
    const nm = Object.entries(c.names).sort((a,b)=>b[1]-a[1])[0];
    return `<tr class="click" data-zc="${c.cx}-${c.cy}"><td><b>Quadrato ${c.cx+1}-${c.cy+1}</b>${nm?`<div class="sub" style="margin:0">dove sei morto: ${esc(nm[0])}</div>`:''}</td><td>${c.k}</td><td>${c.d}</td><td class="${kd>=1?'up':'down'}">${f1(kd,2)}</td></tr>`; }).join('');
  return `<div class="card"><div class="top-row"><div><h2>${mapName(map)}</h2><div class="sub">${ms.length} ${ms.length===1?'partita':'partite'} · ${kc} kill e ${dc} morti${side==='all'?'':' (lato '+side+')'}</div></div>
    <div class="legend" data-layers="${id}">
      <label><input type="checkbox" data-layer="kills" ${L.kills?'checked':''}><span class="dot" style="background:#2bd47d"></span> Tue kill (dove eri)</label>
      <label><input type="checkbox" data-layer="deaths" ${L.deaths?'checked':''}><span style="color:#ff5c5c;font-weight:700">✕</span> Tue morti (linea dal killer)</label>
      <label><input type="checkbox" data-layer="heat" ${L.heat?'checked':''}> Mappa di calore</label></div></div>
    <div class="maprow"><div>${svg}</div>
      <div><h3>Zone con più scontri</h3><div class="sub">Come leggerla: la mappa ha una griglia 10×10 con i numeri in giallo sui bordi. "Quadrato 7-3" = colonna 7 (da sinistra) e riga 3 (dall'alto). Passa il mouse (o clicca) su una riga per vedere il quadrato sulla mappa. <b>Kill</b> = quante volte hai ucciso mentre eri in quel quadrato, <b>Morti</b> = quante volte sei morto lì, <b>K/D</b> = kill diviso morti: sotto 1 (rosso) è una zona dove perdi più scontri di quanti ne vinci.</div>
      ${cells.length?`<table><thead><tr><th>Zona</th><th>Kill</th><th>Morti</th><th>K/D</th></tr></thead><tbody>${zones}</tbody></table>`:'<div class="empty">Servono almeno 2 scontri nella stessa zona.</div>'}
      <p class="sub" style="margin-top:12px">Passa sopra un punto per vedere round, arma e distanza. Verde = dove eri quando hai ucciso, rosso = dove sei morto.</p></div></div></div>`;
}

/* ---- utility ---- */
function lineups(utils, kind){
  const groups = [];
  for(const u of utils.filter(u=>u.kind===kind && u.ox!==undefined)){
    let g = groups.find(g => g.side===u.side && Math.hypot(g.lx-u.lx, g.ly-u.ly) < 180);
    if(!g){ g = {side:u.side, lx:u.lx, ly:u.ly, items:[]}; groups.push(g); }
    g.items.push(u);
  }
  return groups.map(g => {
    const ox = g.items.reduce((s,u)=>s+u.ox,0)/g.items.length, oy = g.items.reduce((s,u)=>s+u.oy,0)/g.items.length;
    const spread = g.items.reduce((s,u)=>s+Math.hypot(u.ox-ox,u.oy-oy),0)/g.items.length;
    const tavg = g.items.reduce((s,u)=>s+u.t,0)/g.items.length;
    return {...g, ox, oy, spread, tavg, n:g.items.length};
  }).sort((a,b)=>b.n-a.n);
}
function viewUtility(ms){
  const maps = [...new Set(ms.map(m=>m.map))];
  if(!maps.length) return '<div class="empty">Nessuna partita con questi filtri.</div>';
  if(!state.mapSel || !maps.includes(state.mapSel)) state.mapSel = maps[0];
  const map = state.mapSel, mm = ms.filter(m=>m.map===map), side = state.fSide;
  const utils = mm.flatMap(m => m.me.util.filter(u=>sideOk(side,u)).map(u=>({...u, mid:m.id})));
  const refs = state.uRef ? mm.flatMap(m => m.smoke_ref.filter(s=>!s.me && sideOk(side,s))) : [];
  const pts = [...utils.map(u=>[u.lx,u.ly]), ...utils.filter(u=>u.ox!==undefined).map(u=>[u.ox,u.oy]), ...refs.map(r=>[r.lx,r.ly])];
  const pt = ptFn(map, pts.length?pts:[[0,0],[1,1]]);
  const sh = [];
  for(const r of refs){ const [u,v]=pt(r.lx,r.ly); sh.push(`<circle cx="${u}" cy="${v}" r="9" fill="#9aa7b8" fill-opacity=".35" stroke="#fff" stroke-opacity=".5" ${tipAttr('Smoke di un altro giocatore · '+r.side+' · '+r.t+' s')}/>`); }
  for(const u of utils){
    if(!state.uKinds[u.kind]) continue;
    const [lx,ly]=pt(u.lx,u.ly); const c = KCOL[u.kind]; const rad = u.kind==='smoke'?15:9;
    let line=''; if(u.ox!==undefined){ const [ox,oy]=pt(u.ox,u.oy); line = `<line x1="${ox}" y1="${oy}" x2="${lx}" y2="${ly}" stroke="${c}" stroke-opacity=".7" stroke-width="2" stroke-dasharray="7 5"/><circle cx="${ox}" cy="${oy}" r="5" fill="#fff" stroke="#000"/>`; }
    sh.push(`${line}<circle cx="${lx}" cy="${ly}" r="${rad}" fill="${c}" fill-opacity=".55" stroke="#fff" stroke-width="2" ${tipAttr(KIND[u.kind]+' · round '+u.r+' · '+u.side+' · a '+u.t+' s'+(u.pitch!==undefined?' · mira '+u.pitch+'° / '+u.yaw+'°':''))}/>`);
  }
  const U = utilAgg(mm, side);
  const fl = U.flashAll||0;
  const smokeGroups = lineups(utils, 'smoke').filter(g=>g.n>=1).slice(0,8);
  const glist = smokeGroups.map(g => {
    const cons = g.n>=2 ? (g.spread < 60 ? '<span class="up">molto ripetibile</span>' : g.spread < 150 ? '<span class="mid">abbastanza ripetibile</span>' : '<span class="down">poco ripetibile</span>') : 'un solo lancio';
    return `<tr><td><span class="side ${g.side}">${g.side}</span></td><td>${g.n}</td><td>${f1(g.tavg,0)} s</td><td>${f1(g.spread,0)}</td><td style="text-align:left;white-space:normal">${cons}</td></tr>`; }).join('');
  const per = k => f1(U.thrown[k]/Math.max(1,U.R)*mm.length*0+U.thrown[k]/Math.max(1,U.R),2);
  return `<div class="chips" id="mapChips">${maps.map(mp=>`<button data-map="${mp}" aria-pressed="${state.mapSel===mp}">${mapName(mp)}</button>`).join('')}</div>
  <div class="grid kpis">
    ${kpi('Smoke / round', per('smoke'), U.thrown.smoke+' lanciate')}
    ${kpi('Flash / round', per('flash'), U.thrown.flash+' lanciate')}
    ${kpi('Flash efficaci', fl? f1(U.ef/fl,2):'–', `${U.ef} nemici accecati (≥1 s) su ${fl} flash`)}
    ${kpi('Compagni accecati', U.tf, f1(U.tft,1)+' s totali', U.tf>=4?'down':'')}
    ${kpi('Danni HE', f1(U.heD,0), U.thrown.he+' lanciate')}
    ${kpi('Danni molotov', f1(U.moD,0), U.thrown.molotov+' lanciate')}
  </div>
  <div class="card"><div class="top-row"><div><h2>Granate su ${mapName(map)}</h2><div class="sub">Pallino bianco = dove eri quando l'hai lanciata, cerchio colorato = dove è arrivata. I valori flash e danni sono su tutti i round.</div></div>
    <div class="legend" id="ukinds">${Object.keys(KIND).map(k=>`<label><input type="checkbox" data-kind="${k}" ${state.uKinds[k]?'checked':''}><span class="dot" style="background:${KCOL[k]}"></span> ${KIND[k]}</label>`).join('')}<label><input type="checkbox" id="uref" ${state.uRef?'checked':''}> Smoke degli altri giocatori</label></div></div>
    <div class="maprow"><div>${radarSVG(map, sh)}</div>
    <div><h3>Le tue smoke ripetute</h3><div class="sub">Lanci con arrivo vicino (entro ~180 unità) raggruppati. Dispersione = distanza media in unità di gioco tra i punti da cui lanci: sotto 60 vuol dire che usi sempre la stessa lineup.</div>
      ${glist?`<table><thead><tr><th>Lato</th><th>Lanci</th><th>Tempo medio</th><th>Dispersione</th><th></th></tr></thead><tbody>${glist}</tbody></table>`:'<div class="empty">Nessuna smoke lanciata con questi filtri.</div>'}
      <p class="sub" style="margin-top:10px">Confronta con le smoke degli altri giocatori (opzione sopra): se le tue finiscono in punti isolati, probabilmente non sono lineup standard.</p></div></div></div>`;
}

/* ---- weapons ---- */
function viewArmi(ms){
  const side = state.fSide;
  const W = {}, HZ = {};
  const dk = [0,0,0,0], dd = [0,0,0,0], bins = [[0,10],[10,20],[20,30],[30,999]];
  const fl = {wb:0, sm:0, blind:0, air:0, ns:0};
  for(const m of ms){
    for(const w of m.me.weapons){ const o = W[w.w] = W[w.w] || {shots:0,hits:0,hs_hits:0,dmg:0,kills:0,hs_kills:0}; for(const k in o) o[k]+=w[k]; }
    for(const [z,n] of Object.entries(m.me.hit_zones)) HZ[z] = (HZ[z]||0)+n;
    for(const e of m.me.kills) if(sideOk(side,e)){ dk[bins.findIndex(b=>e.dist>=b[0]&&e.dist<b[1])]++; for(const k of Object.keys(fl)) if(e[k]) fl[k]++; }
    for(const e of m.me.deaths) if(sideOk(side,e)&&!e.teamkill) dd[bins.findIndex(b=>e.dist>=b[0]&&e.dist<b[1])]++;
  }
  const wr = Object.entries(W).filter(([w,o])=>w!=='knife').sort((a,b)=>b[1].kills*1000+b[1].shots - (a[1].kills*1000+a[1].shots));
  const tb = wr.map(([w,o]) => `<tr><td>${wname(w)}</td><td>${o.shots}</td><td>${o.hits}</td><td>${pc(o.hits/Math.max(1,o.shots))}</td><td>${pc(o.hs_hits/Math.max(1,o.hits))}</td><td>${f1(o.dmg/Math.max(1,o.hits),0)}</td><td>${o.kills}</td></tr>`).join('');
  const tot = sum(Object.values(HZ));
  const hz = Object.entries(HZ).sort((a,b)=>b[1]-a[1]).map(([z,n])=>`<div class="hrow"><span>${z}</span><div class="bar"><i style="width:${n/Math.max(1,tot)*100}%"></i></div><span class="n">${pc(n/Math.max(1,tot))} · ${n}</span></div>`).join('');
  const mx = Math.max(1,...dk,...dd);
  const dist = bins.map((b,i)=>`<div class="hrow"><span>${b[0]}${b[1]>=999?'+':'-'+b[1]} m</span><div><div class="bar" ${tipAttr(dk[i]+' kill')}><i style="width:${dk[i]/mx*100}%;background:var(--good)"></i></div><div class="bar" style="margin-top:3px" ${tipAttr(dd[i]+' morti')}><i style="width:${dd[i]/mx*100}%;background:var(--bad)"></i></div></div><span class="n">${dk[i]} / ${dd[i]}</span></div>`).join('');
  return `<div class="grid g2">
    <div class="card"><h2>Armi</h2><div class="sub">Colpi sparati, colpi a segno e kill per arma. I colpi a segno non contano granate né coltello.</div>
      <div class="scroll"><table><thead><tr><th>Arma</th><th>Colpi</th><th>A segno</th><th>Precisione</th><th>Testa</th><th>Danno/colpo</th><th>Kill</th></tr></thead><tbody>${tb}</tbody></table></div></div>
    <div class="card"><h2>Dove colpisci</h2><div class="sub">Distribuzione dei colpi a segno per zona del corpo.</div>${hz||'<div class="empty">Nessun dato</div>'}</div>
    <div class="card"><h2>Distanza dei duelli</h2><div class="sub">Verde = kill, rosso = morti, per distanza in metri.</div>${dist}</div>
    <div class="card"><h2>Tipi di kill</h2><div class="sub">Quante delle tue kill rientrano in queste categorie.</div>
      <table><tbody><tr><td>Attraverso una smoke</td><td>${fl.sm}</td></tr><tr><td>Wallbang</td><td>${fl.wb}</td></tr><tr><td>Mentre eri accecato</td><td>${fl.blind}</td></tr><tr><td>In aria</td><td>${fl.air}</td></tr><tr><td>No scope</td><td>${fl.ns}</td></tr></tbody></table></div>
  </div>`;
}

    <pre>python cs_parser.py --steamid ${SID} --out cs_data.json demo1.dem demo2.dem demo3.dem</pre>
    <p class="sub">4. Premi <b>Importa dati</b> in alto e scegli <code>cs_data.json</code>. Le partite già presenti non vengono duplicate.</p></div>`;
}

<script>
/* Mistakes: analysis of every death (classification runs here, so it can change without re-parsing demos) */
const U_M = 52.5;                       // game units per metre

function recentOf(e){
  const m = state.matches.find(x=>x.me.deaths.includes(e)), c = e.c || {}, lines = [], myKills = [];
  if(!m) return {lines, myKills, full:false};
  const me_ = (c.pos||[]).find(p=>p.tm==='me');
  const dm = (x,y) => me_ && x!=null ? Math.round(Math.hypot(x-me_.x, y-me_.y)/U_M) : null;
  for(const k of m.me.kills) if(k.r===e.r && k.t<e.t && e.t-k.t<=12) myKills.push({dt:+(e.t-k.t).toFixed(1), victim:k.victim, w:k.w, ax:k.ax, ay:k.ay});
  const full = Array.isArray(c.ev);
  const tm = s => s>0.049 ? `−${Math.round(s)} s` : s<-0.049 ? `+${Math.round(-s)} s` : '0 s';
  const items = [];
  let tradeOf = null;
  if(full){
    const ev = c.ev;
    ev.forEach(x=>{
      if(x.k==='d'){
        const where = x.x!=null && me_ ? ` · a ${dm(x.x,x.y)} m da te` : '';

function posAnalysis(e){
  const c = e.c; if(!c || !c.pos) return null;
  const me_ = c.pos.find(p=>p.tm==='me'), ki = c.pos.find(p=>p.k);
  if(!me_ || !ki) return null;
  const tr = c.tr||[], ang = (a,b)=>Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
  const dif = (a,b)=>{let d=Math.abs(a-b)%360; return d>180?360-d:d;};
  const dist = (a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
