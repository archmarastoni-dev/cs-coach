    const n = tr.length, a = tr[Math.max(0,n-3)], b = tr[n-1];
    dk0 = Math.hypot(a[0]-ki.x,a[1]-ki.y); dk1 = Math.hypot(b[0]-ki.x,b[1]-ki.y);
    for(let i=1;i<n;i++) path += Math.hypot(tr[i][0]-tr[i-1][0],tr[i][1]-tr[i-1][1]);
    let last=null;
    for(let i=1;i<n;i++){ const dx=tr[i][0]-tr[i-1][0], dy=tr[i][1]-tr[i-1][1]; if(Math.hypot(dx,dy)<80) continue; const a2=Math.atan2(dy,dx)*180/Math.PI; if(last!=null && dif(a2,last)>120) rev=true; last=a2; }
  }
  const avg = tr.length>1 ? path/((tr.length-1)*0.5) : sp;
  const adv = dk0!=null ? dk0-dk1 : 0;
  if(tr.length<3) R.peek='n/d';
  else if(rev){ R.peek='jiggle'; R.lines.push('Peek: hai cambiato direzione di colpo negli ultimi secondi (jiggle o affaccio e ritorno). Tecnica giusta contro uno sniper o per far sprecare utility, ma se ti è costata la vita l\'avversario aveva già il mirino sul punto di rientro.'); }
  else if(avg<45){ R.peek='fermo'; R.lines.push('Peek: eri fermo (tenevi l\'angolo). Hai atteso l\'avversario: va bene se il tuo mirino era già sul punto giusto e se un compagno poteva coprirti.'); }
  else if(adv>=150 && sp>110){ R.peek='avanzata'; R.lines.push(`Peek: stavi avanzando verso ${esc(e.killer)} (ti sei avvicinato di ${Math.round(adv/U_M)} m in 1 s) a ${sp} u/s. È un peek largo: l'avversario, già fermo, vede prima e spara da fermo.`); }
  else if(adv<=-150){ R.peek='ritirata'; R.lines.push(`Peek: ti stavi allontanando da ${esc(e.killer)} (ritirata di ${Math.round(-adv/U_M)} m in 1 s). Ti ha colpito mentre ti ritiravi: spesso conviene rompere la linea di tiro invece di correre in rettilineo.`); }
  else { R.peek='laterale'; R.lines.push(`Peek: movimento laterale/di riposizionamento a ${sp} u/s, senza avvicinarti o allontanarti dall'avversario.`); }
  // 2) opponents: exposure and crossfire
  const foes = c.pos.filter(p=>p.tm==='foe'), fd = foes.map(p=>({p, d:dist(me_,p), b:ang(me_,p)})).sort((a,b)=>a.d-b.d);
  const close = fd.filter(x=>x.d<=2500);
  let xf = false;
  for(let i=0;i<close.length&&!xf;i++) for(let j=i+1;j<close.length;j++) if(dif(close[i].b,close[j].b)>50){ xf=true; break; }
  if(xf){ R.tags.push('crossfire'); R.lines.push(`Avversari: ${close.length} nemici entro ${Math.round(2500/U_M)} m da angolazioni diverse (oltre 50° tra loro): eri esposto in crossfire, non potevi guardare tutti gli angoli.`); }
  else if(close.length>=2) R.lines.push(`Avversari: ${close.length} nemici vicini ma dalla stessa direzione: uno solo alla volta poteva sparare, il duello era gestibile con utility o con un compagno già puntato.`);
  else if(foes.length>=2 && !close.length) R.lines.push('Avversari: nessun altro nemico vicino, il duello era 1 contro 1 a distanza.');
  // 3) teammates
  const mates = c.pos.filter(p=>p.tm==='mate').map(p=>({p,d:dist(me_,p),b:ang(me_,p),dk:dist(p,ki)})).sort((a,b)=>a.d-b.d);
  const kb = ang(me_,ki), myDk = dist(me_,ki);
  if(!mates.length) R.lines.push('Compagni: eri l\'ultimo vivo della squadra.');
  else {
    const n0 = mates[0], off = dif(n0.b,kb), md = Math.round(n0.d/U_M);
    const where = off<30?'dietro di te, sulla stessa linea di tiro (può solo seguirti, non crea crossfire)':off<=110?'di lato (angolo utile per un crossfire)':'dal lato opposto all\'avversario (non vedeva il tuo duello)';
    R.lines.push(`Compagni: il più vicino (${esc(n0.p.n)}) era a ${md} m, ${where}.`);
    const ahead = mates.filter(m=>m.dk<myDk-100).length;
    if(!ahead && mates.length) { R.tags.push('piuavanti'); R.lines.push('Eri il giocatore più avanti verso l\'avversario: hai preso il contatto per primo, senza nessuno più avanti a farti da scudo.'); }
    const cl = mates.filter(m=>m.d<=350).length;
    if(cl>=2) R.lines.push(`Eri raggruppato con ${cl} compagni (entro ~7 m): una sola granata o uno spray vi prende tutti, meglio distanziarsi.`);
    if(off>=30&&off<=110&&n0.d<=1300&&!e.traded) R.lines.push('Il compagno era in posizione per il trade ma non l\'ha fatto: probabilmente stava guardando altrove o è arrivato in ritardo.');
  }
  // 4) view data (newer demos)
  if(me_.yw!=null && ki.yw!=null){

    if(me_.cr) R.lines.push('Eri accovacciato quando sei morto.');
  }

  const g = c.geo;

    if(g.exp>=1.5) { R.tags.push('espostolungo'); R.lines.push(`Linea di tiro: eri visibile dalla posizione di ${esc(e.killer)} da almeno ${g.exp} s prima di morire: sei rimasto troppo a lungo nella sua linea (mappa reale).`); }
    else if(g.exp<=0.5) R.lines.push(`Linea di tiro: sei entrato nella sua linea di tiro solo ora (peek rapido): ${esc(e.killer)} era già in posizione e ti aspettava.`);
    else R.lines.push(`Linea di tiro: eri esposto a ${esc(e.killer)} da circa ${g.exp} s.`);
    if(g.fv>=2){ R.tags.push('piunemici'); R.lines.push(`Nemici con linea di tiro su di te: ${g.fv} (mappa reale): più avversari potevano sparare nello stesso momento.`); }
    if(g.mk===0 && c.ma>=1){ R.tags.push('nessunacopertura'); R.lines.push('Compagni: nessuno aveva linea di tiro sul punto dove stava l\'avversario, quindi nessuno poteva coprirti o vendicarti subito.'); }
    else if(g.mk>=1) R.lines.push(`Compagni: ${g.mk} avevano linea di tiro sull'avversario (potevano coprirti o vendicarti).`);
    if(g.cov){ R.tags.push('copertura'); const d=g.cov.d; const dirT = Math.abs(d)===180?'indietro':Math.abs(d)<=90?(d>0?'di lato (sinistra)':'di lato (destra)'):(d>0?'indietro a sinistra':'indietro a destra'); R.lines.push(`Copertura vicina: bastava un passo di ${g.cov.m} m ${dirT} per uscire dalla sua linea di tiro.`); }
    else R.lines.push('Copertura vicina: nessun punto entro ~2,4 m spezzava la sua linea di tiro: eri in uno spazio aperto.');
  }
  return R;
}
function posSummary(L){
  const A = L.map(it=>posAnalysis(it.e)).filter(Boolean); if(A.length<5) return '';
  const n = A.length, cnt = k=>A.filter(r=>r.peek===k).length, tg = k=>A.filter(r=>r.tags.includes(k)).length;
  const items = [['Avanzata verso il nemico',cnt('avanzata'),'#ff5c5c'],['Fermo ad un angolo',cnt('fermo'),'#4aa3ff'],['Cambio direzione (strafe/jiggle)',cnt('jiggle'),'#e8c53a'],['Ritirata',cnt('ritirata'),'#9aa7b8'],['Laterale',cnt('laterale'),'#2bd47d']].filter(x=>x[1]);
  const pm = (k)=>pc(k/n);
  const adv = cnt('avanzata'), xf = tg('crossfire'), fw = tg('piuavanti');
  const tips = [];
  if(adv/n>=0.3) tips.push(`Nel ${pm(adv)} delle morti stavi avanzando verso l'avversario: apri gli angoli con shoulder peek e utility invece di un peek largo.`);
  if(xf/n>=0.25) tips.push(`Nel ${pm(xf)} dei casi avevi nemici da più angolazioni (crossfire): evita posizioni in cui più angoli ti vedono e fatti coprire.`);
  if(fw/n>=0.4) tips.push(`Nel ${pm(fw)} dei casi eri il più avanti della squadra: aspetta che un compagno sia accanto prima di prendere il contatto.`);
  const G = A.filter(r=>r.geo), gn = G.length;
  if(gn>=5){ const ex=G.filter(r=>r.tags.includes('espostolungo')).length, cv=G.filter(r=>r.tags.includes('copertura')).length, nc=G.filter(r=>r.tags.includes('nessunacopertura')).length;
    if(ex/gn>=0.3) tips.push(`Con la mappa reale: nel ${pc(ex/gn)} delle morti eri nella linea di tiro dell'avversario da almeno 1,5 s.`);
    if(cv/gn>=0.3) tips.push(`Nel ${pc(cv/gn)} delle morti bastava un passo di 1-2 m per spezzare la sua linea: usa di più gli angoli e i ripari vicini.`);
    if(nc/gn>=0.3) tips.push(`Nel ${pc(nc/gn)} dei casi nessun compagno vedeva l'avversario: nessuna copertura per il trade.`); }
  return `<div class="card"><h2>Peek e posizionamento alla morte</h2><div class="sub">Su ${n} morti analizzate: come ti muovevi, dove erano avversari e compagni.</div>${stackBar(items)}${tips.length?`<ul style="margin:10px 0 0;padding-left:20px">${tips.map(x=>`<li style="margin:4px 0">${esc(x)}</li>`).join('')}</ul>`:''}<p class="sub" style="margin-top:8px">${gn>=5?`Geometria reale disponibile per ${gn} morti.`:'Limite: la geometria reale della mappa è disponibile solo per le demo analizzate con awpy.'}</p></div>`;
}
function posBlock(e){

function framesStrip(m, e){

    for(const p of f.p){
      const [u,v] = pt(p[0],p[1]);
      const col = p[2]===0 ? '#ffd34d' : p[2]===1 ? '#4aa3ff' : '#ff5c5c';
      if(p[3]>=0){
        const rad = p[3]*Math.PI/180, [u2,v2] = pt(p[0]+Math.cos(rad)*100, p[1]+Math.sin(rad)*100);
        const ang = Math.atan2(v2-v, u2-u), L = R(70), w = 0.7;
        const a1=[u+Math.cos(ang-w)*L, v+Math.sin(ang-w)*L], a2=[u+Math.cos(ang+w)*L, v+Math.sin(ang+w)*L];
        sh.push(`<polygon points="${u.toFixed(1)},${v.toFixed(1)} ${a1[0].toFixed(1)},${a1[1].toFixed(1)} ${a2[0].toFixed(1)},${a2[1].toFixed(1)}" fill="${col}" fill-opacity=".22"/>`);
      }
      if(p[2]===0) sh.push(`<path d="M${u-R(10)} ${v-R(10)}L${u+R(10)} ${v+R(10)}M${u+R(10)} ${v-R(10)}L${u-R(10)} ${v+R(10)}" stroke="#ffd34d" stroke-width="${R(6)}" stroke-linecap="round"/>`);
      else sh.push(`<circle cx="${u.toFixed(1)}" cy="${v.toFixed(1)}" r="${R(p[4]?10:8)}" fill="${col}" stroke="${p[4]?'#fff':'#000'}" stroke-width="${R(p[4]?3.5:2)}"/>`);
    }
    return `<figure style="margin:0"><div style="border-radius:8px;overflow:hidden">${radarSVG(map, sh, {vb: vb.map(v=>+v.toFixed(1)).join(' ')})}</div><figcaption class="sub" style="text-align:center;margin-top:4px">${f.dt===0?'Alla morte':'−'+Math.abs(f.dt)+' s'}</figcaption></figure>`;
  }).join('');
  return `<div style="margin-top:14px"><h3 style="margin:0 0 4px">Come si è sviluppata la situazione (da −3 s alla morte)</h3>
    <div class="sub">Quattro fotogrammi dalla mappa 2D: ✕ giallo = tu, blu = compagni, rosso = avversari (bordo bianco = chi ti ha ucciso). I coni mostrano dove guardava ognuno. Cerchi: smoke (grigio), flash (giallo), HE (arancio), molotov (rosso).</div>
    <div class="frames">${figs}</div></div>`;
}

/* ---- mistakes inside a single match ---- */
function matchErrors(m){
  const side = state.fSide;
  const all = m.me.deaths.filter(e=>!e.teamkill && sideOk(side,e));
  const L = all.filter(e=>e.c).map(e=>({m,e,rev:reviewDeath(e)}));
  if(!all.length) return '<div class="empty">Nessuna morte in questa partita con i filtri scelti.</div>';
  if(!L.length) return '<div class="empty">Per questa partita non c\'è il dettaglio delle morti: è stata analizzata prima di questa funzione e la demo non c\'è più.</div>';
  const cnt = {}; for(const it of L) for(const id of new Set(it.rev.map(r=>r.id))) cnt[id] = (cnt[id]||0)+1;
  const top = Object.keys(cnt).filter(k=>k!=='ok'&&k!=='scontro').sort((a,b)=>cnt[b]-cnt[a]).slice(0,3);
  const noFr = L.filter(it=>!it.e.c.fr).length;
  const fl = m.me.util.filter(u=>u.kind==='flash'&&u.en!==undefined);
  const flTab = fl.length ? `<div class="card"><h2>Le tue flash in questa partita</h2><div class="sub">Per ogni flash: quanti nemici sono stati accecati (≥1,1 s), se hai accecato compagni o te stesso, e se un avversario accecato è stato ucciso subito dopo.</div><div class="scroll"><table><thead><tr><th>Round</th><th>Lato</th><th>Nemici accecati</th><th>Compagni</th><th>Tu</th><th>Kill dopo la flash</th><th>Giudizio</th></tr></thead><tbody>${fl.map(u=>`<tr><td>${u.r}</td><td><span class="side ${u.side}">${u.side}</span></td><td>${u.en}${u.bd?` (fino a ${u.bd} s)`:''}</td><td class="${u.tm?'down':''}">${u.tm}</td><td class="${u.sf>=1?'down':''}">${u.sf?u.sf+' s':'–'}</td><td>${u.fk?'<b class="up">sì</b>':'no'}</td><td style="text-align:left;white-space:normal">${u.en===0?'<span class="down">nessun nemico accecato: lancio sprecato</span>':u.fk?'<span class="up">ha portato una kill</span>':u.tm?'<span class="mid">hai accecato un compagno</span>':'<span class="mid">ha accecato ma senza kill</span>'}</td></tr>`).join('')}</tbody></table></div></div>` : '';
  return `${noFr?`<div class="note">${noFr===L.length?'Per questa partita non ci sono i fotogrammi':'Per '+noFr+' morti non ci sono i fotogrammi'}: si registrano solo per le demo analizzate dopo questo aggiornamento. Resta la mappa con la posizione di tutti al momento della morte.</div>`:''}
  <div class="card"><h2>Errori di questa partita</h2><div class="sub">${L.length} morti analizzate${top.length?'. Cause principali qui: '+top.map(k=>`<b>${ECAT[k]}</b> (${cnt[k]})`).join(', '):''}. Una morte può avere più cause; l'analisi su tutte le partite è nel tab "Errori e fix".</div></div>
  ${flTab}
  ${L.map(it=>deathCard(it)).join('')}`;
}

<script>
/* ---- how to throw flashes and smokes (Mistakes tab) ---- */
function medianOf(a){ if(!a.length) return NaN; const s=a.slice().sort((x,y)=>x-y), h=s.length>>1; return s.length%2?s[h]:(s[h-1]+s[h])/2; }
function modeOf(a){ const c={}; let b=null; for(const x of a){ if(!x) continue; c[x]=(c[x]||0)+1; if(b===null||c[x]>c[b]) b=x; } return b; }
function utilSpots(L){
  const g = new Map();
  for(const it of L){
    const e = it.e, c = e.c, u = c.ut;
    if(!(u.flash||u.smoke||u.he||u.molotov)) continue;
    const key = it.m.map+'|'+e.side+'|'+(c.pl||'?');
    const o = g.get(key)||{map:it.m.map, side:e.side, pl:c.pl||'?', kp:'?', kps:[], n:0, fl:0, sm:0, mo:0, he:0, d:[], w:[], fa:[], xf:0};
    o.n++; o.kps.push(c.kp||''); if(u.flash) o.fl++; if(u.smoke) o.sm++; if(u.molotov) o.mo++; if(u.he) o.he++;
    o.d.push(e.dist); o.w.push(e.w); o.fa.push(c.fa);
    const pa = posAnalysis(e); if(pa && pa.tags.includes('crossfire')) o.xf++;
    g.set(key,o);
  }
  const out = [...g.values()].filter(o=>o.n>=2).sort((a,b)=>b.n-a.n || b.fl-a.fl).slice(0,6);
  for(const o of out) o.kp = modeOf(o.kps) || '?';
  return out;
}
function throwAdvice(s){
  const d = medianOf(s.d), w = modeOf(s.w), long = d>=25 || /awp|ssg|scar|g3sg1/i.test(w||''), out = [];
  const kp = s.kp!=='?'?s.kp:'il punto da cui arriva l\'avversario', pl = s.pl!=='?'?s.pl:'la tua posizione';
  if(s.fl){
    if(d<=12) out.push({k:'Flash', t:`Distanza tipica ${f1(d,0)} m: usa una pop flash corta. Tasto destro (lancio basso), contro un muro vicino all'angolo in modo che scoppi dentro la visuale dell'avversario a ${kp}, e affacciati subito allo scoppio.`});
    else if(d<=25) out.push({k:'Flash', t:`Distanza tipica ${f1(d,0)} m: usa una flash media (premi insieme i due tasti), fatta rimbalzare sopra o dietro l'angolo così scoppia su ${kp}; affacciati nel momento in cui scoppia, non prima.`});
    else out.push({k:'Flash', t:`Distanza tipica ${f1(d,0)} m: una flash lunga (tasto sinistro, lancio alto sopra ${kp}) è possibile ma facile da girare; a questa distanza di solito è meglio una smoke che tagli la linea.`});
  }
  if(s.sm){
    if(long) out.push({k:'Smoke', t:`Avversari a ${f1(d,0)} m${/awp|ssg/i.test(w||'')?' con arma da cecchino':''}: una smoke su ${kp} taglia la linea di tiro lunga mentre attraversi o ti riposizioni. È una lineup fissa: impara quella standard di questa mappa e ripetila 10 volte in una mappa di pratica.`});
    else if(s.xf>=Math.ceil(s.n/2)) out.push({k:'Smoke', t:`Qui eri spesso esposto a più angoli insieme: una smoke su uno dei due angoli (${kp} o quello opposto) ti lascia un solo duello da gestire.`});
    else if(d<10) out.push({k:'Molotov / HE', t:`Distanza ravvicinata (${f1(d,0)} m): la smoke serve poco, meglio una molotov o una HE su ${kp} per costringere l'avversario a lasciare l'angolo prima di aprirlo.`});
    else out.push({k:'Smoke', t:`Una smoke su ${kp} da ${pl} toglie la visuale all'avversario e ti dà il tempo di far arrivare un compagno.`});
  }
  if(s.mo||s.he) out.push({k:'Molotov / HE', t:`Avevi ancora ${s.mo?'una molotov':'una HE'}: gettala su ${kp} prima di entrare in ${pl}, così l'avversario deve spostarsi o prende danno prima del duello.`});
  return out;
}
function utilCoach(ms, L){
  const side = state.fSide, U = utilAgg(ms, side);
  const fl = ms.flatMap(m=>m.me.util.filter(u=>u.kind==='flash'&&u.en!==undefined&&sideOk(side,u)));
  const sm = ms.flatMap(m=>m.me.util.filter(u=>u.kind==='smoke'&&u.ne!==undefined&&sideOk(side,u)));
  const nF = U.flashAll||0;
  const per = nF ? U.ef/nF : NaN, tpf = nF ? U.tf/nF : NaN;
  const deathsU = L.filter(it=>{const u=it.e.c.ut; return u.flash||u.smoke||u.he||u.molotov;});
  const VAL = {flash:200, smoke:300, he:300};
  const val = it=>{const u=it.e.c.ut; return u.flash*VAL.flash + u.smoke*VAL.smoke + u.he*VAL.he + u.molotov*(it.e.side==='CT'?500:400);};
  const lost = deathsU.reduce((a,it)=>a+val(it),0);
  const tips = [];
  if(nF>=10 && per<0.6) tips.push(`Accechi in media ${f1(per,2)} nemici per flash (riferimento tipico degli utenti Leetify: 0,6-0,9). Lancia le flash dove i nemici stanno guardando e fai rimbalzare la granata in modo che scoppi nella loro visuale, non dopo che si sono girati.`);
  if(nF>=10 && tpf>=0.3) tips.push(`Accechi ${f1(tpf,2)} compagni per flash: avvisa prima di lanciare ("flash in ...") e non lanciare attraverso le zone dove i compagni stanno entrando.`);
  if(L.length>=8 && deathsU.length/L.length>=0.4) tips.push(`In ${deathsU.length} morti su ${L.length} (${pc(deathsU.length/L.length)}) avevi ancora utility: in media circa ${Math.round(lost/deathsU.length/10)*10} $ di granate ancora in tasca a ogni morte. Prima di ogni contatto lancia la prima flash o smoke che hai in mano.`);
  if(sm.length>=5){ const gd = sm.filter(u=>u.ne>=1).length; if(gd/sm.length<0.5) tips.push(`Solo il ${pc(gd/sm.length)} delle tue smoke aveva un nemico entro ~15 m dal punto di scoppio (metrica Leetify): molte vengono lanciate senza che nessuno stia arrivando. Tienile per l'execute o per tagliare un push che stai sentendo.`); }
  const spots = utilSpots(L);
  const spotHtml = spots.map(s=>{
    const adv = throwAdvice(s);
    return `<div class="iss ok" style="border-color:#e8c53a"><h4>${mapName(s.map)} · ${s.side} · in ${esc(s.pl)}${s.kp!=='?'&&s.kp!==s.pl?` (di solito ti uccide chi è a ${esc(s.kp)})`:''} <span class="sub" style="display:inline">(${s.n} ${s.n===1?'morte':'morti'} con utility in tasca${s.fl?`, ${s.fl} con flash`:''}${s.sm?`, ${s.sm} con smoke`:''})</span></h4>${adv.map(a=>`<p><b>${esc(a.k)}:</b> ${esc(a.t)}</p>`).join('')}</div>`;
  }).join('');
  const flN = fl.length;
  const kpis = [
    nF ? kpi('Nemici accecati per flash', f1(per,2), `${U.ef} su ${nF} flash (≥1 s) · tipico 0,6-0,9`, per>=0.6?'up':'down') : '',
    nF ? kpi('Compagni accecati per flash', f1(tpf,2), `${U.tf} in totale`, tpf<=0.25?'up':'down') : '',
    flN>=5 ? kpi('Flash che portano una kill', pc(fl.filter(u=>u.fk).length/flN), `su ${flN} flash analizzate`, fl.filter(u=>u.fk).length/flN>=0.1?'up':'mid') : '',
    flN>=5 ? kpi('Flash a vuoto', pc(fl.filter(u=>u.en===0).length/flN), 'nessun nemico accecato', fl.filter(u=>u.en===0).length/flN<=0.4?'up':'down') : '',
    sm.length>=5 ? kpi('Smoke con nemici vicini', pc(sm.filter(u=>u.ne>=1).length/sm.length), `su ${sm.length} smoke`, '') : '',
    L.length ? kpi('Morti con utility in tasca', pc(deathsU.length/L.length), `${deathsU.length} su ${L.length}`, deathsU.length/L.length<=0.25?'up':'down') : ''
  ].join('');
  return `<div class="card"><h2>Flash e smoke: come lanciarle</h2>
    <div class="sub">Gli analisti guardano l'utility come un lavoro per un compagno (togliere una visuale, spostare un difensore, sostenere un duello, aprire la strada alla bomba) e non come granate sparse. Qui i tuoi numeri e, per i punti dove muori con utility in tasca, come usarla.</div>
    <div class="grid kpis" style="margin-top:10px">${kpis}</div>
    ${tips.length?`<h3 style="margin:14px 0 4px">Cosa dicono i numeri</h3><ul style="margin:0;padding-left:20px">${tips.map(t=>`<li style="margin:4px 0">${esc(t)}</li>`).join('')}</ul>`:''}
    ${!flN?`<p class="sub" style="margin-top:8px">I dettagli per ogni flash (nemici accecati, kill dopo la flash) e per ogni smoke si registrano solo per le demo nuove.</p>`:''}
    <h3 style="margin:16px 0 2px">Dove muori con utility in tasca</h3>
    <div class="sub">Raggruppo le morti per mappa, lato e posizione in cui sei morto. Le indicazioni sono principi ricavati da distanza, arma e numero di avversari; il punto esatto di lancio (lineup) va imparato con una mappa di pratica.</div>
    ${spotHtml || '<p class="sub">Servono almeno qualche morte con utility ancora in tasca.</p>'}
    <h3 style="margin:16px 0 2px">Tecnica di lancio</h3>
    <ul style="margin:6px 0 0;padding-left:20px">
      <li style="margin:4px 0"><b>Tasto sinistro</b> = lancio lungo, <b>destro</b> = lancio corto basso, <b>entrambi</b> = distanza media. Correre in avanti aumenta la distanza, indietro la riduce; da fermo il lancio è più ripetibile.</li>
      <li style="margin:4px 0"><b>Jump throw</b>: tieni premuto il tasto sinistro, salta e rilascia mentre sali. Il bind a tasto unico non funziona più sui server ufficiali, si fa a mano.</li>
      <li style="margin:4px 0"><b>Pop flash</b>: scoppia appena entra nella visuale del nemico, quindi non gli dà il tempo di girarsi. Se è per un compagno avvisalo ("flash in ...") e fallo uscire nel momento dello scoppio; se è per te lanciala poco prima di uscire. Una flash serve a chi segue: se nessuno la sfrutta, è sprecata.</li>
      <li style="margin:4px 0"><b>Smoke</b>: dura circa 20 s e reagisce a HE e proiettili. Una molotov viene spenta da una smoke. Dopo il piazzamento tieni una smoke o una flash per il retake.</li>
      <li style="margin:4px 0"><b>Priorità di acquisto</b> a soldi limitati: smoke, una flash, molotov, seconda flash, HE.</li>
      <li style="margin:4px 0"><b>Allenamento</b>: in una mappa offline con <code>sv_cheats 1</code> usa <code>cl_grenadepreview 1</code> (traiettoria) e <code>sv_rethrow_last_grenade</code> (ripeti l'ultimo lancio). Ripeti ogni lineup 10 volte.</li>
    </ul>
    <p class="srcs">Fonti: ${srcLinks(['grenade','pop','gloss','proexec'])}</p></div>`;
}
function deathCard(it){
  const {m,e,rev} = it, c = e.c;
  const bad = rev.some(r=>r.sev==='alta'), tag = e.traded ? 'tradata' : 'non tradata';
  return `<div class="card" id="d-${m.id}-${e.r}-${e.tick}"><div class="dcard"><div>${deathRadar(m,e)}
      <div class="leg"><span><i style="background:#ffd34d"></i>Tu (✕) e la tua scia negli ultimi 4 s</span><span><i style="background:#4aa3ff"></i>Compagni</span><span><i style="background:#ff5c5c"></i>Avversari (bordo bianco = chi ti ha ucciso)</span></div></div>
    <div><h3>${mapName(m.map)} · round ${e.r} · ${e.t} s · ${e.side==='T'?'T':'CT'}</h3>
      <div class="sub">${esc(c.pl||'?')} · ${pathTxt(c)} ucciso da ${esc(e.killer)} (${esc(wname(e.w))}${e.hs?', headshot':''}, ${f1(e.dist,0)} m) · morte ${tag} · ${c.ma} ${c.ma===1?'compagno':'compagni'} e ${c.fa} ${c.fa===1?'avversario':'avversari'} ancora vivi</div>
      ${recentBlock(e)}

      <div class="iss ok" style="border-color:#4aa3ff"><h4>Tattica consigliata per un round simile</h4>${tactics(e,rev).map(t=>`<p>• ${esc(t)}</p>`).join('')}<p class="srcs">Fonti: ${srcLinks([...new Set(rev.flatMap(r=>SRC_BY[r.id]||[]))])||'vedi elenco in fondo alla pagina'}</p></div></div></div>${framesStrip(m,e)}</div>`;
}
function timingBars(ms){
  const BIN = 15, N = 8, kills = Array(N).fill(0), deaths = Array(N).fill(0);
  for(const m of ms){
    for(const e of m.me.kills) if(sideOk(state.fSide,e)) kills[Math.min(N-1,Math.floor(e.t/BIN))]++;
    for(const e of m.me.deaths) if(sideOk(state.fSide,e) && !e.teamkill) deaths[Math.min(N-1,Math.floor(e.t/BIN))]++;

    <p class="sub" style="margin-top:10px">${D?`Il ${pc(early)} delle tue morti arriva nei primi 30 s (${pc(earlyK)} delle kill). `:''}${early>0.5?'Muori troppo presto: aspetta i compagni e usa utility prima del contatto.':early<0.25&&D>=6?'Giochi soprattutto a round avanzato: attenzione ai finali in inferiorità.':'La distribuzione è equilibrata.'}</p></div>`;
}
function placeTable(L){
  const g = new Map();
  for(const it of L){ const k = it.m.map+'|'+it.e.c.pl; const o = g.get(k)||{map:it.m.map,pl:it.e.c.pl,n:0,tr:0}; o.n++; if(it.e.traded) o.tr++; g.set(k,o); }

}
function stackBar(parts){

  <div class="leg">${parts.map(p=>`<span><i style="background:${p[2]}"></i>${p[0]} ${pc(p[1]/tot)}</span>`).join('')}</div>`;
}
function aimSection(ms){
  const B = ['st','sl','mv'], sh = {st:[0,0],sl:[0,0],mv:[0,0]}, fs = {st:[0,0],sl:[0,0],mv:[0,0]};

    for(const e of m.me.kills) if(e.a && e.a.e0!=null && sideOk(state.fSide,e)) K.push(e.a);

<script>
/* E-learning: entry views (home, map page). Static content (Italian) lives in data/learn/*.js */
Object.assign(SRC, LEARN_SOURCES);

function learnData(mapId){
  const mm = state.matches.filter(m=>m.map===mapId);
  if(!mm.length) return '';
  const a = agg(mm,'all'), c = agg(mm,'CT'), t = agg(mm,'T');
  return `<div class="card"><h2>I tuoi dati su ${mapName(mapId)}</h2><div class="sub">Dalle tue partite caricate.</div>
    <div class="kpis"><div><b>${mm.length}</b><span>partite</span></div><div><b>${a.mw}-${a.n-a.mw}</b><span>vinte-perse</span></div><div><b>${pc(c.rwP)}</b><span>round vinti CT</span></div><div><b>${pc(t.rwP)}</b><span>round vinti T</span></div></div></div>`;
}
const lrnList = (items, cls='') => `<ul class="lrn-list ${cls}">${items.map(x=>`<li>${typeof x==='string'?esc(x):`<b>${esc(x[0])}.</b> ${esc(x[1])}`}</li>`).join('')}</ul>`;

function learnPathCard(p){
  const P = LEARN_PATHS[p];
  return `<div class="card"><h2>${esc(P.titolo)}</h2><div class="sub">${esc(P.sotto)}</div>
   <div class="lrn-mods">${P.moduli.map(m=>`<details class="lrn-mod"><summary>${esc(m[0])}</summary>${lrnList(m[1])}</details>`).join('')}</div>
   <p class="srcs">Fonti: ${srcLinks(P.fonti)}</p></div>`;
}
function learnHome(){
  const path = state.learn.path;
  const mapsCards = LEARN_MAPS.map(L=>`<button class="lrn-map" data-lmap="${L.id}">
      <svg viewBox="0 0 1000 1000" aria-hidden="true">${RADARS[L.id]?`<image href="${RADARS[L.id]}" x="0" y="0" width="1000" height="1000"/>`:''}</svg>
      <span class="n">${mapName(L.id)}${L.nuova?' <i class="pill D">nuova nel pool</i>':''}</span><span class="t">${esc(L.tag)}</span></button>`).join('');
  return `<div class="card"><h2>E-learning</h2>
    <div class="sub">Mappe del pool attuale (Active Duty): Ancient, Anubis, Cache, Dust II, Inferno, Mirage, Nuke. Scegli il tuo mondo: giocare in squadra e giocare in solo sono due modi diversi di imparare.</div>
    <div class="seg" id="lpath">${[['team','Team (5 che parlano)'],['solo','SoloQ (con sconosciuti)']].map(([v,l])=>`<button data-lpath="${v}" aria-pressed="${path===v}">${l}</button>`).join('')}</div></div>
    ${learnPathCard(path)}

<script>
/* ===== Where to throw from: throw position and direction drawn on the radar from the official setpos coordinates ===== */
function parseSetpos(sp){ const m = /setpos\s+(-?[\d.]+)\s+(-?[\d.]+)\s+(-?[\d.]+);setang\s+(-?[\d.]+)\s+(-?[\d.]+)/.exec(sp||''); return m ? {x:+m[1], y:+m[2], pitch:+m[4], yaw:+m[5]} : null; }
function throwGeom(id, sp){
  const c = MAPS[id], p = parseSetpos(sp); if(!c || !p) return null;
  const px = (p.x - c.pos_x)/c.scale/1024*1000, py = (c.pos_y - p.y)/c.scale/1024*1000;
  const a = p.yaw*Math.PI/180; return {px, py, dx: Math.cos(a), dy: -Math.sin(a)};
}
function throwMarks(g, big){
  const L = big ? 90 : 70, w = big ? 5 : 6, ex = g.px + g.dx*L, ey = g.py + g.dy*L;
  const hx = (k)=> ex - g.dx*18 + (-g.dy)*k, hy = (k)=> ey - g.dy*18 + (g.dx)*k;
  return `<line x1="${g.px}" y1="${g.py}" x2="${ex}" y2="${ey}" stroke="#fff" stroke-width="${w+3}" stroke-linecap="round"/><line x1="${g.px}" y1="${g.py}" x2="${ex}" y2="${ey}" stroke="#22c55e" stroke-width="${w}" stroke-linecap="round"/>
    <polygon points="${ex+g.dx*10},${ey+g.dy*10} ${hx(9)},${hy(9)} ${hx(-9)},${hy(-9)}" fill="#22c55e" stroke="#fff" stroke-width="2"/>
    <circle cx="${g.px}" cy="${g.py}" r="${big?11:12}" fill="#22c55e" stroke="#fff" stroke-width="3"/>`;
}
function throwSvg(id, sp, big){
  const g = throwGeom(id, sp), r = RADARS[id]; if(!g || !r) return '';
  if(big) return calloutSvg(id, true, throwMarks(g, true));
  const S = 330, vx = Math.max(0, Math.min(1000-S, g.px - S/2)), vy = Math.max(0, Math.min(1000-S, g.py - S/2));
  const pins = (LEARN_CALLOUTS[id]||[]).filter(([n,x,y]) => x*10>=vx && x*10<=vx+S && y*10>=vy && y*10<=vy+S).map(([n,x,y]) => `<text x="${x*10}" y="${y*10}" font-size="15" text-anchor="middle" fill="#fff" stroke="#111" stroke-width="3.5" paint-order="stroke" font-weight="600">${esc(n)}</text>`).join('');
  return `<svg viewBox="${vx} ${vy} ${S} ${S}" class="lrn-thr-svg" role="img" aria-label="Punto di lancio sulla mappa"><image href="${r}" x="0" y="0" width="1000" height="1000"/>${pins}${throwMarks(g,false)}</svg>`;
}
function lbThrow(id, i){
  const o = (LEARN_OFFICIAL[id]||[])[i]; if(!o) return;
  let el = document.getElementById('lb');
  if(!el){ el = document.createElement('div'); el.id='lb'; document.body.appendChild(el); }
  LB.list = [];
  el.innerHTML = `<div class="lb-bg" data-lbclose="1"></div><figure class="lb-fig"><div class="lb-map">${throwSvg(id, o[5], true)}</div><figcaption>${esc(o[0])}: pallino verde = dove stare, freccia = direzione in cui mirare</figcaption></figure><button class="lb-x" data-lbclose="1" aria-label="Chiudi">✕</button>`;
  el.style.display='flex';
}

<script>
/* ===== Analysis of the player's own matches against the main strats of each map =====
   Compares thrown utility (landing zones, origins and angles), death positions and movement with the key utility per map
   (data/learn/analysis-zones.js) and the official Valve lineups (data/learn/official-lineups.js). */
function anPct(id,x,y){ const c=MAPS[id]; return [(x-c.pos_x)/c.scale/1024*100,(c.pos_y-y)/c.scale/1024*100]; }
function anNear(id,x,y,maxd=9){
  if(!MAPS[id]||!LEARN_CALLOUTS[id]) return null;
  const [px,py]=anPct(id,x,y); let b=null;
  for(const [n,cx,cy] of LEARN_CALLOUTS[id]){ const d=Math.hypot(cx-px,cy-py); if(!b||d<b[0]) b=[d,n]; }
  return b&&b[0]<maxd?b[1]:'fuori dalle zone note';
}
const anMed = a => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
const anSp = (n,w,pl)=> n===1?'1 '+w:n+' '+(pl||(w==='round'?'round':w==='partita'?'partite':w+'s'));
function anLineups(id, utils){
  const out=[];
  (LEARN_OFFICIAL[id]||[]).forEach((L,i)=>{
    const m=/setpos (\S+) (\S+) (\S+);setang (\S+) (\S+)/.exec(L[5]||''); if(!m) return;
    const [x,y,,p,yw]=m.slice(1).map(Number); let st='mai';
    for(const u of utils){ if(u.ox==null||u.kind!==L[1]) continue;
      const d=Math.hypot(u.ox-x,u.oy-y), dy=Math.abs((u.yaw-yw+540)%360-180), dp=Math.abs(u.pitch-p);
      if(d<120&&dy<12&&dp<12){ st='usata'; break; }
      if(d<260&&dy<20) st='vicina'; }
    out.push({name:L[0],kind:L[1],st,i});
  });
  return out;
}
function learnAnalysis(id){
  const mm = (state.matches||[]).filter(m=>m.map===id && m.me);
  if(!mm.length) return '';
  const nM = mm.length;
  const rnds = {T:0,CT:0};
  mm.forEach(m=>(m.rounds||[]).forEach(r=>{ if(rnds[r.side]!=null) rnds[r.side]++; }));
  const utils = mm.flatMap(m=>(m.me.util||[]).map(u=>({...u,_m:m.id})));
  const deaths = mm.flatMap(m=>(m.me.deaths||[]).map(d=>({...d,_m:m.id})));
  const kills = mm.flatMap(m=>(m.me.kills||[]).map(d=>({...d,_m:m.id})));
  const KIND={smoke:'smoke',molotov:'molotov',flash:'flash',he:'HE'};
  // 1) utility per side and coverage of the key zones
  const sideBlocks = ['T','CT'].map(side=>{
    const nr=rnds[side]; if(!nr) return '';
    const us = utils.filter(u=>u.side===side);
    const per = k=>{ const n=us.filter(u=>u.kind===k).length; return (n/nr).toFixed(1); };
    const tmed = k=>{ const v=anMed(us.filter(u=>u.kind===k).map(u=>u.t)); return v==null?'–':Math.round(v)+' s'; };
    const zones = (AN_ZONES[id]&&AN_ZONES[id][side]||[]).map(([lab,kind,zs])=>{
      const roundsHit = new Set(), tot = us.filter(u=>u.kind===kind);
      let n=0;
      tot.forEach(u=>{ const z=anNear(id,u.lx,u.ly); if(zs.includes(z)){ roundsHit.add(u._m+':'+u.r); n++; } });
      const pctv = Math.round(100*roundsHit.size/nr);
      return `<tr><td>${esc(lab)}</td><td class="num">${n}</td><td class="num">${roundsHit.size}/${nr}</td><td><span class="an-bar"><i style="width:${Math.min(100,pctv*1.6)}%"></i></span> ${pctv}%</td></tr>`;
    }).join('');
    const land = k=>{ const c={}; us.filter(u=>u.kind===k).forEach(u=>{ const z=anNear(id,u.lx,u.ly)||'?'; c[z]=(c[z]||0)+1; });
      return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([z,n])=>`${esc(z)} ×${n}`).join(', ')||'–'; };
    return `<h3>Da ${side==='T'?'attaccante (T)':'difensore (CT)'} · ${anSp(nr,'round')}</h3>
     <div class="an-kpis">${['smoke','molotov','flash','he'].map(k=>`<div><b>${per(k)}</b><span>${KIND[k]} / round<br>mediana a ${tmed(k)}</span></div>`).join('')}</div>
     ${zones?`<table class="an-tbl"><thead><tr><th>Utility chiave della strat</th><th>Lanci</th><th>Round</th><th>Frequenza</th></tr></thead><tbody>${zones}</tbody></table>`:''}
     <p class="an-land"><b>Dove cadono di solito.</b> Smoke: ${land('smoke')}. Molotov: ${land('molotov')}.</p>`;
  }).join('');
  // 2) standard Valve lineups
  const lu = anLineups(id, utils.filter(u=>u.kind==='smoke'||u.kind==='molotov'));
  const used = lu.filter(x=>x.st==='usata').length, near = lu.filter(x=>x.st==='vicina').length;
  const luHtml = lu.length?`<h3>Lanci standard (Valve)</h3>
    <p class="an-note">Confronto la posizione e la direzione di ogni tua smoke/molotov con i ${lu.length} lanci ufficiali di questa mappa. <b>Usata</b> = stessa posizione (±2,3 m) e stessa mira (±12°); <b>vicina</b> = posizione e direzione simili ma non precise. Hai usato ${used}, vicine ${near}, mai ${lu.length-used-near}.</p>
    <div class="an-lu">${lu.map(x=>`<span class="an-lu-i ${x.st}" title="${x.st}">${esc(x.name)} · ${x.st}</span>`).join('')}</div>`:'';
  // 3) position and movement
  const dC = deaths.filter(d=>d.c), nd = dC.length;
  const pctOf = (n,d)=> d?Math.round(100*n/d)+'%':'–';
  const iso = dC.filter(d=>d.c&&d.c.md!=null&&d.c.md>800).length;
  const unused = dC.filter(d=>d.c&&d.c.ut&&(d.c.ut.flash+d.c.ut.smoke+d.c.ut.he+d.c.ut.molotov)>0).length;
  const movN = dC.filter(d=>d.c&&d.c.sp>110).length;
  const flashed = dC.filter(d=>d.c&&d.c.fl>0.3).length;
  const openD = deaths.filter(d=>d.open).length, openK = kills.filter(k=>k.open).length;
  const dz = {}; deaths.forEach(d=>{ if(d.vx==null) return; const z=anNear(id,d.vx,d.vy,12); if(z){ const k=d.side+' · '+z; dz[k]=(dz[k]||0)+1; } });
  const dzTop = Object.entries(dz).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const mv = {st:[0,0],sl:[0,0],mv:[0,0]};
  mm.forEach(m=>{ const a=m.me.mov&&m.me.mov.all; if(a) for(const k in mv){ mv[k][0]+=a[k][0]; mv[k][1]+=a[k][1]; } });
  const sh = mv.st[0]+mv.sl[0]+mv.mv[0];
  const hr = k=>mv[k][0]?Math.round(100*mv[k][1]/mv[k][0])+'%':'–';
  const movHtml = `<h3>Posizione e movimento</h3>${nd<deaths.length?`<p class="an-note">Il contesto della morte (distanza dai compagni, velocità, utility) c'è per ${nd} morti su ${deaths.length}: le partite più vecchie non lo avevano. Ricaricale con il parser aggiornato per completare il quadro.</p>`:''}
    <div class="an-kpis"><div><b>${pctOf(iso,nd)}</b><span>morti lontano dai compagni (&gt;15 m)</span></div><div><b>${pctOf(unused,nd)}</b><span>morti con utility ancora in tasca</span></div><div><b>${pctOf(movN,nd)}</b><span>morti mentre correvi</span></div><div><b>${pctOf(flashed,nd)}</b><span>morti da accecato</span></div></div>
    <p class="an-land"><b>Duello d'apertura.</b> Prime morti: ${openD} · prime kill: ${openK} in ${anSp(rnds.T+rnds.CT,'round')}. <b>Dove muori di più:</b> ${dzTop.length?dzTop.map(([k,n])=>`${esc(k)} ×${n}`).join(', '):'–'}.</p>
    <p class="an-land"><b>Mira e movimento (fucili).</b> Colpi fermo: ${hr('st')} a segno (${mv.st[0]}), camminando piano: ${hr('sl')} (${mv.sl[0]}), correndo: ${hr('mv')} (${mv.mv[0]}). Spari mentre corri: ${sh?Math.round(100*mv.mv[0]/sh):0}%.</p>`;
  // 4) what to fix (simple rules)
  const tips=[];
  { const side='T', nr=rnds.T, z0=(AN_ZONES[id]&&AN_ZONES[id].T||[])[0];
    if(z0&&nr>=8){ const hit=new Set(); utils.filter(u=>u.side===side&&u.kind===z0[1]).forEach(u=>{ if(z0[2].includes(anNear(id,u.lx,u.ly))) hit.add(u._m+':'+u.r); });
      if(hit.size/nr<0.15) tips.push(`Da T lanci raramente «${z0[0]}» (${hit.size} round su ${nr}). È l'utility che apre di più il round su questa mappa: provala di più, almeno nei round di default.`); } }
  if(nd>=8){
    if(iso/nd>0.4) tips.push(`Muori spesso lontano dai compagni (${pctOf(iso,nd)}): resta a distanza di trade, così il compagno ti vendica subito.`);
    if(unused/nd>0.5) tips.push(`In ${pctOf(unused,nd)} delle morti avevi ancora granate in tasca: usale prima del contatto (flash per il peek, smoke per tagliare).`);
    if(movN/nd>0.45) tips.push(`Il ${pctOf(movN,nd)} delle volte muori mentre corri: fermati un attimo prima di aprire lo scontro, la mira precisa richiede di essere fermi.`);
    if(openD>openK*1.3 && openD>=4) tips.push(`Perdi più duelli d'apertura di quanti ne vinci (${openD} contro ${openK}): evita di essere il primo a spingere senza flash o compagno dietro.`);
  }
  if(sh>200 && mv.mv[0]/sh>0.2 && mv.mv[0] && mv.st[0] && (mv.mv[1]/mv.mv[0]) < 0.85*(mv.st[1]/mv.st[0])) tips.push(`Spari ${Math.round(100*mv.mv[0]/sh)}% dei colpi correndo, con ${hr('mv')} a segno contro ${hr('st')} da fermo: stop e poi spara.`);
  if(lu.length && used===0) tips.push(`Nessuna tua granata coincide con i ${lu.length} lanci standard di questa mappa: impararne 2 o 3 (vedi «Lanci ufficiali») ti dà round più puliti.`);
  const vids = (LEARN_VIDEOS[id]||[]).slice(0,2).map(v=>`<a href="https://www.youtube.com/watch?v=${esc(v[0])}" target="_blank" rel="noopener">${esc(v[3])} (${esc(v[1])})</a>`).join(' · ');
  const tipHtml = `<h3>Cosa correggere per primo</h3>${tips.length?`<ul class="lrn-list">${tips.slice(0,5).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'<p class="an-note">Nessuna debolezza netta emerge da queste partite: continua a giocare e ricarica i dati.</p>'}${vids?`<p class="an-note">Per ripassare le utility di questa mappa: ${vids}</p>`:''}`;
  const small = nM<3?`<p class="lrn-warn">Campione piccolo (${anSp(nM,'partita')}): considera i numeri come indizi, non come verità.</p>`:'';
  return `<div class="card an"><h2>Le tue partite contro le strat · ${mapName(id)}</h2>
    <div class="sub">Partite analizzate: ${nM}. Zone di lancio classificate con i callout della mappa; i confronti sono con le strat descritte più sotto.</div>${small}
    ${sideBlocks}${luHtml}${movHtml}${tipHtml}
    <p class="an-note">Per approfondire: <a href="https://boostroom.com/blog/how-to-stop-dying-first-in-cs2-positioning-timing-guide" target="_blank" rel="noopener">come smettere di morire per primo (posizione e timing)</a> · <a href="https://www.ggrecon.com/guides/counter-strike-2-beginners-guide-tips-and-tricks/" target="_blank" rel="noopener">trade e utility prima del peek (GGRecon)</a> · <a href="https://refrag.gg/blog/4-of-the-worst-cs2-entry-fragging-mistakes-that-you-probably-make/" target="_blank" rel="noopener">errori da entry fragger (Refrag)</a></p>
    <p class="an-note">Limiti: le demo non vengono conservate, quindi l'analisi usa solo ciò che il parser ha salvato (lanci, kill, morti, velocità). Non sa quale strat stessi giocando né cosa chiedesse il tuo team: la «frequenza» dice quanto spesso fai quella cosa, non se era giusta in quel round.</p></div>`;
}

function learnOverview(){
  const rows = LEARN_MAPS.map(L=>{
    const mm=(state.matches||[]).filter(m=>m.map===L.id&&m.me); if(!mm.length) return '';
    const d=mm.flatMap(m=>(m.me.deaths||[]).filter(x=>x.c)); const n=d.length;
    const p=f=>n?Math.round(100*d.filter(f).length/n)+'%':'–';
    const ut=mm.flatMap(m=>m.me.util||[]); const nr=mm.reduce((a,m)=>a+(m.rounds||[]).length,0);
    const a=agg(mm,'all');
    return `<tr><td><button class="btn" data-lmap="${L.id}">${mapName(L.id)}</button></td><td class="num">${mm.length}</td><td class="num">${a.mw}-${a.n-a.mw}</td><td class="num">${nr?(ut.length/nr).toFixed(1):'–'}</td><td class="num">${p(x=>x.c.md!=null&&x.c.md>800)}</td><td class="num">${p(x=>(x.c.ut.flash+x.c.ut.smoke+x.c.ut.he+x.c.ut.molotov)>0)}</td><td class="num">${p(x=>x.c.sp>110)}</td></tr>`;
  }).join('');
  if(!rows) return '';
  return `<div class="card an"><h2>Il tuo quadro generale</h2><div class="sub">Dalle tue partite caricate, mappa per mappa. Apri una mappa per l'analisi completa contro le sue strat.</div>
   <table class="an-tbl"><thead><tr><th>Mappa</th><th>Partite</th><th>V-P</th><th>Granate / round</th><th>Morti lontano dai compagni</th><th>Morti con utility in tasca</th><th>Morti correndo</th></tr></thead><tbody>${rows}</tbody></table>
   <p class="an-note">Le percentuali usano solo le morti con contesto salvato dal parser. Con poche partite per mappa sono indizi, non verità.</p></div>`;
}

<script>
/* Render: welcome screen, main render() and tab switching */
function welcome(){
  return `<div class="card"><h2>Benvenuto in CS Coach</h2><div class="sub">Analizza le tue partite di CS2 (Premier, FACEIT, Competitivo) a partire dalle demo. Tutto resta sul tuo computer: la pagina non carica nulla online.</div>
  <ol style="padding-left:20px;margin:0">
    <li>Installa <b>Python 3</b> e le librerie: <code>pip install demoparser2 pandas</code></li>
    <li>Scarica <code>cs_coach.py</code> e <code>cs_parser.py</code> (te li dà chi ti ha passato questa pagina) in una cartella.</li>
    <li>Metti le demo <code>.dem</code> in una cartella e lancia:</li></ol>
  <pre>python cs_coach.py --steamid IL_TUO_STEAMID64 --folder "C:\\percorso\\demo"</pre>
  <p class="sub">Il tuo SteamID64 è il numero lungo di 17 cifre (lo trovi su steamid.io). Lo script crea <code>cs_data.json</code>.</p>
  <ol start="4" style="padding-left:20px;margin:0"><li>Qui sopra premi <b>Importa dati</b> e scegli <code>cs_data.json</code>.</li></ol>
  <p style="margin-top:14px"><button class="btn" id="btnImp2">Importa dati</button></p></div>`;
}
function render(){
  renderChrome();
  const ms = filtered();
  let html = '';
  if(state.learn.on && !LITE) html = viewLearn();
  else if(!state.matches.length) html = welcome();
  else if(state.tab==='panoramica') html = ms.length ? viewPanoramica(ms) : '<div class="empty">Nessuna partita con questi filtri.</div>';
  else if(state.tab==='partite') html = viewPartite(ms);
  else if(state.tab==='mappe') html = viewMappe(ms);
  else if(state.tab==='utility') html = viewUtility(ms);
  else if(state.tab==='errori') html = viewErrori(ms);
  else if(state.tab==='armi') html = ms.length ? viewArmi(ms) : '<div class="empty">Nessuna partita con questi filtri.</div>';
  else html = ms.length ? viewCoach(ms) : '<div class="empty">Nessuna partita con questi filtri.</div>';
  $('#main').innerHTML = html;
  initZoom();
  if(state.focusDeath){ const el = document.getElementById(state.focusDeath); state.focusDeath = null; if(el) el.scrollIntoView({block:'start'}); }
}
function setTab(t){ state.tab = t; state.sel = null; try{ history.replaceState(null,'','#'+t); }catch(e){} render(); window.scrollTo(0,0); }
</script>
<script>
/* Events: one delegated click handler, data import and notes */
document.addEventListener('click', e => {
  const lbA = e.target.closest('a[data-lb]'); if(lbA && !LITE){ e.preventDefault(); return lbOpen(lbA); }
  const lbM = e.target.closest('[data-lbmap]'); if(lbM && !LITE){ return lbMap(lbM.dataset.lbmap); }
  const lbT = e.target.closest('[data-lbthrow]'); if(lbT && !LITE){ const [m,i]=lbT.dataset.lbthrow.split('|'); return lbThrow(m,+i); }
  const lbX = e.target.closest('[data-lbclose]'); if(lbX){ return lbClose(); }
  const lbG = e.target.closest('[data-lbgo]'); if(lbG){ return lbGo(+lbG.dataset.lbgo); }
  const t = e.target.closest('button,tr,th,input,[data-tab]'); if(!t) return;
  if(t.dataset.learn){ state.learn.on = t.dataset.learn==='1'; state.learn.map = null; render(); return window.scrollTo(0,0); }
  if(t.dataset.lpath){ state.learn.path = t.dataset.lpath; return render(); }
  if(t.dataset.lmap){ state.learn.map = t.dataset.lmap; render(); return window.scrollTo(0,0); }
  if(t.dataset.copy){ copyText(t.dataset.copy).then(ok=>{ const o=t.textContent; t.textContent = ok?'Copiato!':'Non copiato: selezionalo a mano'; setTimeout(()=>{t.textContent=o},1600); }); return; }
  if(t.dataset.lback){ state.learn.map = null; render(); return window.scrollTo(0,0); }
  if(t.dataset.tab){ state.learn.on = false; return setTab(t.dataset.tab); }
  if(t.closest('#fSide')){ state.fSide = t.dataset.v; return render(); }
  if(t.closest('#fRes')){ state.fRes = t.dataset.v; return render(); }
  if(t.closest('#mode')){ state.mode = t.dataset.v; return render(); }
  if(t.id==='btnImp'||t.id==='btnImp2') return $('#imp').click();
  if(t.dataset.ecat!==undefined){ state.eCat = t.dataset.ecat; state.ePlace = null; state.eShown = 10; return render(); }
  if(t.dataset.eplace!==undefined){ state.ePlace = state.ePlace===t.dataset.eplace ? null : t.dataset.eplace; state.eShown = 10; return render(); }
  if(t.dataset.emore){ state.eShown += 10; return render(); }
  if(t.dataset.gomatch){ state.tab='partite'; state.sel = t.dataset.gomatch; state.selView='err'; state.focusDeath = t.dataset.gofocus||null; return render(); }
  if(t.dataset.trend){ state.trend = t.dataset.trend; return render(); }
  if(LITE && (t.dataset.gotoMap||t.dataset.match||t.id==='btnImp')) return;
  if(t.dataset.gotoMap){ state.mapSel = t.dataset.gotoMap; return setTab('mappe'); }
  if(t.dataset.map){ state.mapSel = t.dataset.map; return render(); }
  if(t.dataset.sort){ const k = t.dataset.sort; if(state.sortKey===k) state.sortDir*=-1; else {state.sortKey=k; state.sortDir=(k==='map'||k==='idx')?1:-1;} return render(); }
  if(t.dataset.match){ state.sel = t.dataset.match; state.selView='analisi'; state.openRound=null; return render(); }
  if(t.dataset.back){ state.sel = null; return render(); }
  if(t.closest('#mview')){ state.selView = t.dataset.v; return render(); }
  if(t.dataset.round){ const r=+t.dataset.round; state.openRound = state.openRound===r?null:r; return render(); }
  if(t.dataset.layer){ state.layers[t.dataset.layer] = t.checked; return render(); }
  if(t.dataset.kind){ state.uKinds[t.dataset.kind] = t.checked; return render(); }
  if(t.id==='uref'){ state.uRef = t.checked; return render(); }
});
document.addEventListener('change', e => {
  if(e.target.id==='fMap'){ state.fMap = e.target.value; state.sel=null; render(); }
  if(e.target.id==='imp') importFile(e.target.files[0]);
});
function importFile(f){
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const j = JSON.parse(rd.result);
      if(!j.matches) throw new Error('File non valido.');
      if(!SID) SID = j.steamid;
      if(j.steamid !== SID) throw new Error('Il file non è un export valido per questo SteamID.');
      const ids = new Set(state.matches.flatMap(m=>[m.id,m.fp,m.valve_id].filter(Boolean))); let add = 0;
      for(const m of j.matches) if(!ids.has(m.id) && !(m.fp && ids.has(m.fp)) && !(m.valve_id && ids.has(m.valve_id))){ state.matches.push(m); add++; }
      state.matches.sort(cmpM);
      const lv = new Set(state.lite.map(l=>l.valve_id));
      for(const l of (j.lite||[])) if(!lv.has(l.valve_id)){ state.lite.push(l); add++; }
      const fv = new Set(state.matches.map(m=>m.valve_id).filter(Boolean));
      state.lite = state.lite.filter(l => !fv.has(l.valve_id)).sort((a,b)=>String(a.played).localeCompare(String(b.played)));
      render(); alert_(add ? `Aggiunte ${add} partite.` : 'Nessuna partita nuova nel file.');
    }catch(err){ alert_('Importazione non riuscita: ' + err.message); }
  };
  rd.readAsText(f);
}
function alert_(msg){
  const n = document.createElement('div'); n.className='note'; n.textContent = msg; n.setAttribute('role','status');
  $('#main').prepend(n); setTimeout(()=>n.remove(), 6000);
}
</script>
<script>
/* map zoom and pan */
const ZS = {};
function initZoom(){
  document.querySelectorAll('svg.radar').forEach((svg, idx) => {
    if(svg.parentNode.classList.contains('zwrap') || svg.closest('.frames')) return;
    const wrap = document.createElement('div'); wrap.className = 'zwrap';
    svg.parentNode.insertBefore(wrap, svg); wrap.appendChild(svg);
    const v0 = svg.getAttribute('viewBox').trim().split(/\s+/).map(Number);
    const key = state.tab+':'+idx, saved = ZS[key];
    let v = (saved && saved.o.join()===v0.join()) ? saved.v.slice() : v0.slice();
    const set = () => { svg.setAttribute('viewBox', v.map(n=>+n.toFixed(2)).join(' ')); ZS[key] = {o:v0, v:v.slice()}; };
    const clamp = () => { v[2] = v[3] = Math.min(1000, Math.max(40, v[2])); v[0] = Math.min(1000-v[2], Math.max(0, v[0])); v[1] = Math.min(1000-v[3], Math.max(0, v[1])); };
    const geo = () => { const r = svg.getBoundingClientRect(), s = Math.min(r.width/v[2], r.height/v[3]); return {r, s, ox:(r.width-v[2]*s)/2, oy:(r.height-v[3]*s)/2}; };
    const zoomAt = (f, cx, cy) => { const nw = Math.min(1000, Math.max(40, v[2]*f)), k = nw/v[2]; v[0] = cx-(cx-v[0])*k; v[1] = cy-(cy-v[1])*k; v[2] = v[3] = nw; clamp(); set(); };
    const centre = () => [v[0]+v[2]/2, v[1]+v[3]/2];
    const reset = () => { v = v0.slice(); set(); };
    svg.addEventListener('wheel', ev => {
      ev.preventDefault();
      const g = geo(), cx = v[0]+(ev.clientX-g.r.left-g.ox)/g.s, cy = v[1]+(ev.clientY-g.r.top-g.oy)/g.s;
      zoomAt(ev.deltaY<0 ? 0.8 : 1.25, cx, cy);
    }, {passive:false});
    let drag = null;
    svg.addEventListener('pointerdown', ev => { if(ev.button!==0) return; drag = {x:ev.clientX, y:ev.clientY, v:v.slice(), on:false, id:ev.pointerId}; });
    svg.addEventListener('pointermove', ev => {
      if(!drag) return;
      const dx = ev.clientX-drag.x, dy = ev.clientY-drag.y;
      if(!drag.on){ if(Math.hypot(dx,dy)<4) return; drag.on = true; svg.classList.add('grab'); try{ svg.setPointerCapture(drag.id); }catch(e){} tip.style.display='none'; }
      const s = geo().s; v[0] = drag.v[0]-dx/s; v[1] = drag.v[1]-dy/s; clamp(); set();
    });
    const end = () => { drag = null; svg.classList.remove('grab'); };
    svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
    svg.addEventListener('dblclick', reset);
    const ctl = document.createElement('div'); ctl.className = 'zctl';
    ctl.innerHTML = '<button type="button" aria-label="Ingrandisci" title="Ingrandisci">+</button><button type="button" aria-label="Riduci" title="Riduci">−</button><button type="button" aria-label="Ripristina vista" title="Ripristina vista">⟲</button>';
    const [bi, bo, br] = ctl.children;
    bi.onclick = () => { const c = centre(); zoomAt(0.7, c[0], c[1]); };
    bo.onclick = () => { const c = centre(); zoomAt(1.43, c[0], c[1]); };
    br.onclick = reset;
    wrap.appendChild(ctl);
    const h = document.createElement('div'); h.className = 'zhint'; h.textContent = 'Rotellina: zoom · trascina: sposta · doppio clic: reset'; wrap.appendChild(h);
    set();
  });
}
/* tooltip */
const tip = $('#tip');
function zcShow(tr, on){ const card = tr.closest('.card'); if(!card) return; card.querySelectorAll('rect.zc').forEach(r=>{ const hit = r.dataset.zr===tr.dataset.zc; r.setAttribute('fill-opacity', on&&hit?'.28':'0'); r.setAttribute('stroke-opacity', on&&hit?'1':'0'); }); }
document.addEventListener('mouseover', e => { const z = e.target.closest('tr[data-zc]'); if(z) zcShow(z,true); });
document.addEventListener('mouseout', e => { const z = e.target.closest('tr[data-zc]'); if(z && !z.contains(e.relatedTarget)) zcShow(z,false); });
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if(t){ tip.textContent = t.dataset.tip; tip.style.display='block'; } else tip.style.display='none'; });
document.addEventListener('mousemove', e => { if(tip.style.display==='block'){ tip.style.left = Math.min(e.clientX+14, innerWidth-300)+'px'; tip.style.top = (e.clientY+14)+'px'; } });

const h0 = location.hash.slice(1); if(TABS.some(t=>t[0]===h0)) state.tab = h0;
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if(TABS.some(t=>t[0]===h) && h!==state.tab){ state.tab=h; state.sel=null; render(); } });
render();
</script>
