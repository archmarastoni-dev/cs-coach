name: Build CSCoach.exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Build the dashboard from src/
        run: python tools/build_dashboard.py
      - name: Build
        shell: cmd
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed --icon icona.ico --name CSCoach
          --add-data "dashboard_template.html;." --add-data "icona.ico;."
          --hidden-import cs_parser --hidden-import cs_coach
          --collect-all demoparser2 --collect-all webview --collect-submodules zstandard
          cs_coach_app.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\CSCoach -DestinationPath CSCoach-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CSCoach-Windows
          path: CSCoach-Windows.zip
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CSCoach-Windows.zip
          generate_release_notes: true
          # tags with a suffix (v0.9.0-beta.1) are published as pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
